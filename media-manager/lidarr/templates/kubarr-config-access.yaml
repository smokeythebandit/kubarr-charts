{{- /* Kubarr's worker reads this app's existing API key from /config/config.xml
(by exec, in this namespace only) to set up Unpackerr, so
the key never has to be rotated. kubarrConfigAccess.enabled=false removes it;
Unpackerr then has to be configured by hand. */ -}}
{{- if (default dict .Values.kubarrConfigAccess).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lidarr.fullname" . }}-kubarr-config-access
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "lidarr.labels" . | nindent 4 }}
rules:
  # WebSocket exec (Kubernetes 1.30+) authorizes "get"; SPDY used "create".
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lidarr.fullname" . }}-kubarr-config-access
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "lidarr.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lidarr.fullname" . }}-kubarr-config-access
subjects:
  - kind: ServiceAccount
    name: {{ .Values.kubarrConfigAccess.serviceAccount }}
    namespace: {{ .Values.kubarrConfigAccess.namespace }}
{{- end }}
