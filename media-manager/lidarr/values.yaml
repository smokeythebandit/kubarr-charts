# Default values for lidarr
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: lidarr

# Lidarr application configuration
lidarr:
  replicaCount: 1

  image:
    repository: linuxserver/lidarr
    pullPolicy: IfNotPresent
    tag: "3.1.6"

  # Service configuration
  service:
    type: ClusterIP
    port: 8686
    targetPort: 8686
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Base path for reverse proxy (e.g., /lidarr)
  basePath: "/lidarr"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 8686
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 8686
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: lidarr
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config", "/custom-services.d/setup-downloadclients", "/custom-services.d/setup-prowlarr", "/kubarr-secrets/sabnzbd", "/kubarr-secrets/prowlarr", "/custom-services.d/setup-slskd", "/kubarr-secrets/slskd"]

storage:
  mounts:
    - {name: library, source: media/music, target: /media/music, mode: read-write}
    - {name: qbittorrent, source: downloads/qbittorrent, target: /downloads/qbittorrent, mode: read-write}
    - {name: transmission, source: downloads/transmission, target: /downloads/transmission, mode: read-write}
    - {name: deluge, source: downloads/deluge, target: /downloads/deluge, mode: read-write}
    - {name: rutorrent, source: downloads/rutorrent, target: /downloads/rutorrent, mode: read-write}
    - {name: sabnzbd, source: downloads/sabnzbd, target: /downloads/sabnzbd, mode: read-write}
    # slskd writes completed downloads here at the same path, for Tubifarry.
    - {name: slskd, source: downloads/slskd, target: /downloads/slskd, mode: read-write}
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass (not managed NFS)
  media:
    existingClaim: media-data

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  # Name of the Kubernetes secret containing VPN credentials
  # Created by Kubarr when you configure VPN in Settings > Networking
  secretName: ""
  # Gluetun container image
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  # Resource limits for Gluetun container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kill switch - block all traffic if VPN disconnects
  killSwitch: true
  # Subnets to allow even when VPN is active (for cluster internal communication)
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""
  # Server picker: chooses the fastest VPN server before gluetun starts and
  # re-evaluates it while the pod runs. Reads fall back to these defaults.
  picker:
    enabled: true
    shortlist: 5
    sample: 40
    initBudget: 60s
    testSeconds: 8
    testEndpoints:
      - https://proof.ovh.net/files/100Mb.dat
      - http://speedtest.tele2.net/100MB.zip
    interval: 15m
    degradeThreshold: 0.4
    degradeChecks: 3
    cooldown: 6h
    switchWhileRunning: true
    image:
      repository: ghcr.io/smokeythebandit/kubarr-vpn-picker
      tag: 26e9358
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# SABnzbd download client. Kubarr sets secretName to a Secret (key: api-key)
# holding the API key it also writes into SABnzbd's own configuration, so this
# service can authenticate to it. Empty means Kubarr supplied no key, and the
# SABnzbd download client is then left unconfigured.
sabnzbdIntegration:
  secretName: ""

# Prowlarr link. Kubarr sets secretName to a Secret (key: api-key) holding the
# API key it also writes into Prowlarr's configuration; Lidarr then registers
# itself in Prowlarr as an application, and Prowlarr pushes its indexers here.
# Empty leaves the registration off.
prowlarrIntegration:
  secretName: ""

# slskd link. Kubarr sets secretName to a Secret (key: api-key) holding the API
# key it also gives slskd; Lidarr then adds Tubifarry's Slskd indexer and
# download client pointing at slskd. Empty leaves both unconfigured.
slskdIntegration:
  secretName: ""

# Tubifarry (github.com/TypNull/Tubifarry, GPL-3.0), the plugin that adds
# Soulseek through slskd. With the slskd link on and the plugin absent, an init
# container downloads this release, checks its sha256 and unpacks it into the
# plugin folder; a failure only skips it. Afterwards Lidarr updates the plugin
# itself, so a newer copy already in place is kept.
tubifarry:
  enabled: true
  # Must support this chart's Lidarr version (2.3.1 needs Lidarr 3.2).
  version: "2.3.0.1"
  sha256: 29005a1fc8712d6df0e6d155468f868770553b699de9d83ae32aee9113569c4d
  # Override for a mirror; defaults to the GitHub release asset.
  url: ""

# Network policy configuration
networkPolicy:
  enabled: true
  # Permit only this release's exporter pod to call the app API in this namespace
  allowExporterIngress: true
  # Namespaces allowed to send traffic to this app
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - victoriametrics  # metrics scraping
    - prowlarr  # indexer manager syncs indexer definitions in
    - unpackerr  # extracts what this app is waiting for
  # Namespaces this app can send traffic to
  egressTo:
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - sabnzbd
    - slskd  # Soulseek, through the Tubifarry plugin
    - prowlarr  # indexer manager

# Metrics exporter (exportarr) - auto-scraped by VictoriaMetrics
# Note: Requires API key from Lidarr (Settings > General > API Key)
exporter:
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    tag: "v2.3.0"
    pullPolicy: IfNotPresent
  # 9707 is Sonarr's and 9708 is Radarr's; keep one port per exporter
  port: 9709
  # API key from Lidarr (Settings > General > API Key)
  # Can be set via secret or directly
  apiKey: ""
  # Or reference an existing secret
  apiKeySecret:
    name: ""
    key: "api-key"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}

# Lets Kubarr's worker read this app's API key (pod exec in this namespace
# only) to set up Unpackerr without rotating the key.
kubarrConfigAccess:
  enabled: true
  serviceAccount: kubarr
  namespace: kubarr-worker
