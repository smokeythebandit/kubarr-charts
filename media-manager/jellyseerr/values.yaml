# Default values for jellyseerr
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: false
  name: jellyseerr

# Jellyseerr application configuration
jellyseerr:
  replicaCount: 1

  image:
    repository: fallenbagel/jellyseerr
    pullPolicy: IfNotPresent
    tag: "2.7.3"

  # Base path for URL routing (leave empty for root)
  # Jellyseerr does not support serving from a subpath
  basePath: ""

  # Service configuration
  service:
    type: ClusterIP
    port: 5055
    targetPort: 5055
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    # Timezone
    TZ: "Etc/UTC"
    # Log level
    LOG_LEVEL: "info"

  # OAuth2/OIDC Configuration (integrated with Kubarr)
  oauth:
    enabled: false
    # These are set by Kubarr during deployment
    clientId: ""
    # clientSecret is stored in a Kubernetes secret
    secretName: "jellyseerr-oauth"
    # Kubarr OAuth2 provider URL (internal cluster URL)
    issuerUrl: "http://kubarr.kubarr.svc.cluster.local:8080"

  # Probes configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/v1/status
      port: 5055
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v1/status
      port: 5055
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: jellyseerr
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage configuration. All app storage is routed through the shared NFS claim.
storage:
  media:
    existingClaim: media-data
    mountPath: /data
    configMountPath: /app/config
    configSubPath: config/jellyseerr
    dataSubPath: media

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  secretName: ""
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  killSwitch: true
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
  egressTo:
    - jellyfin
    - sonarr
    - radarr
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
