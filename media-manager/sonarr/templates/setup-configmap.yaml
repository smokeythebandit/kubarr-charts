apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sonarr.fullname" . }}-setup
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sonarr.labels" . | nindent 4 }}
data:
  setup-indexers.sh: |
    #!/bin/bash
    # Sync configured Jackett indexers into Sonarr as Torznab indexers.
    # Adds "Jackett - <id>" entries for every configured Jackett indexer,
    # removes entries whose indexer disappeared from Jackett.

    CONFIG_FILE="/config/config.xml"
    API_PORT="8989"
    API_BASE="/sonarr"
    CHECK_INTERVAL=30
    PREFIX="Jackett - "

    JACKETT_HOST="jackett.jackett.svc.cluster.local"
    JACKETT_PORT="9117"
    JACKETT_BASE="/jackett"
    # Must match jackett chart's .Values.jackett.apiKey
    JACKETT_API_KEY="kubarr-jackett-api-key-12345"
    # Torznab TV categories
    CATEGORIES='[5000,5030,5040]'

    get_api_key() {
      sed -n 's/.*<ApiKey>\([^<]*\)<\/ApiKey>.*/\1/p' "$CONFIG_FILE" 2>/dev/null
    }

    is_api_ready() {
      curl -s -f -H "X-Api-Key: $1" "http://localhost:$API_PORT$API_BASE/api/v3/system/status" > /dev/null 2>&1
    }

    jackett_indexer_ids() {
      # The JSON admin API needs cookie auth; the Torznab t=indexers query
      # works with the api key and lists configured indexers as XML.
      curl -s -f --connect-timeout 5 \
        "http://$JACKETT_HOST:$JACKETT_PORT$JACKETT_BASE/api/v2.0/indexers/all/results/torznab/api?apikey=$JACKETT_API_KEY&t=indexers&configured=true" 2>/dev/null |
        grep -o '<indexer id="[^"]*"' | sed 's/.*id="//;s/"$//' | sort -u
    }

    arr_indexers_json() {
      curl -s -H "X-Api-Key: $1" "http://localhost:$API_PORT$API_BASE/api/v3/indexer"
    }

    existing_jackett_names() {
      arr_indexers_json "$1" | grep -o "\"name\": *\"$PREFIX[^\"]*\"" | sed "s/.*\"$PREFIX/$PREFIX/;s/\"$//"
    }

    add_indexer() {
      local api_key="$1"
      local jid="$2"
      curl -s -X POST -H "X-Api-Key: $api_key" -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/indexer" \
        -d "{
          \"name\": \"$PREFIX$jid\",
          \"implementation\": \"Torznab\",
          \"implementationName\": \"Torznab\",
          \"configContract\": \"TorznabSettings\",
          \"protocol\": \"torrent\",
          \"priority\": 25,
          \"enableRss\": true,
          \"enableAutomaticSearch\": true,
          \"enableInteractiveSearch\": true,
          \"tags\": [],
          \"fields\": [
            {\"name\": \"baseUrl\", \"value\": \"http://$JACKETT_HOST:$JACKETT_PORT$JACKETT_BASE/api/v2.0/indexers/$jid/results/torznab/\"},
            {\"name\": \"apiPath\", \"value\": \"/api\"},
            {\"name\": \"apiKey\", \"value\": \"$JACKETT_API_KEY\"},
            {\"name\": \"categories\", \"value\": $CATEGORIES},
            {\"name\": \"minimumSeeders\", \"value\": 1}
          ]
        }"
    }

    # Removal needs the numeric indexer id; jq parses reliably. Without jq
    # the sync is add-only, which is still correct for the common case.
    remove_stale_indexers() {
      local api_key="$1"
      local wanted="$2"
      command -v jq > /dev/null 2>&1 || return 0
      arr_indexers_json "$api_key" |
        jq -r ".[] | select(.name | startswith(\"$PREFIX\")) | \"\(.id)|\(.name)\"" |
        while IFS='|' read -r db_id name; do
          jid="${name#"$PREFIX"}"
          if ! echo "$wanted" | grep -qx "$jid"; then
            echo "[indexer-sync] $name no longer configured in Jackett, removing..."
            curl -s -X DELETE -H "X-Api-Key: $api_key" \
              "http://localhost:$API_PORT$API_BASE/api/v3/indexer/$db_id"
          fi
        done
    }

    echo "[indexer-sync] Starting Jackett indexer sync..."
    while true; do
      API_KEY=$(get_api_key)
      if [ -n "$API_KEY" ] && is_api_ready "$API_KEY"; then
        break
      fi
      sleep 2
    done
    echo "[indexer-sync] API is ready"

    while true; do
      API_KEY=$(get_api_key)
      if ! is_api_ready "$API_KEY"; then
        sleep $CHECK_INTERVAL
        continue
      fi

      WANTED=$(jackett_indexer_ids)
      if [ -n "$WANTED" ]; then
        EXISTING=$(existing_jackett_names "$API_KEY")
        echo "$WANTED" | while read -r jid; do
          [ -z "$jid" ] && continue
          if ! echo "$EXISTING" | grep -qx "$PREFIX$jid"; then
            echo "[indexer-sync] Adding $PREFIX$jid..."
            response=$(add_indexer "$API_KEY" "$jid")
            if echo "$response" | grep -q '"id"'; then
              echo "[indexer-sync] Added $PREFIX$jid"
            else
              echo "[indexer-sync] Failed to add $PREFIX$jid: $(echo "$response" | head -c 300)"
            fi
          fi
        done
        remove_stale_indexers "$API_KEY" "$WANTED"
      fi

      sleep $CHECK_INTERVAL
    done
  setup-downloadclients.sh: |
    #!/bin/bash
    # Setup script to manage download clients in Sonarr
    # Supports: qBittorrent, Transmission, Deluge, ruTorrent, SABnzbd
    # Adds clients when available, removes when unavailable

    CONFIG_FILE="/config/config.xml"
    API_PORT="8989"
    API_BASE="/sonarr"
    CHECK_INTERVAL=10

    # SABnzbd API key (must match what's set in SABnzbd setup script)
    SABNZBD_API_KEY="kubarr-sabnzbd-api-key-12345"

    # Download client configurations
    # In restricted mode only mounted clients appear here. Previously saved
    # unselected clients are left untouched; reconcile them before switching.
    # Format: NAME|IMPLEMENTATION|HOST|PORT|CHECK_PATH|CATEGORY_FIELD|CATEGORY_VALUE
    # For SABnzbd, CHECK_PATH includes the API key query param
    CLIENTS="
    {{ if include "kubarr-common.storage.hasDownloadClient" (dict "mounts" .Values.storage.mounts "client" "qbittorrent") }}
    qBittorrent|QBittorrent|qbittorrent.qbittorrent.svc.cluster.local|8080|/api/v2/app/version|tvCategory|Series
    {{ end }}
    {{ if include "kubarr-common.storage.hasDownloadClient" (dict "mounts" .Values.storage.mounts "client" "transmission") }}
    Transmission|Transmission|transmission.transmission.svc.cluster.local|9091|/transmission/web/|tvCategory|Series
    {{ end }}
    {{ if include "kubarr-common.storage.hasDownloadClient" (dict "mounts" .Values.storage.mounts "client" "deluge") }}
    Deluge|Deluge|deluge.deluge.svc.cluster.local|8112|/|tvCategory|series
    {{ end }}
    {{ if include "kubarr-common.storage.hasDownloadClient" (dict "mounts" .Values.storage.mounts "client" "rutorrent") }}
    ruTorrent|RTorrent|rutorrent.rutorrent.svc.cluster.local|8000|/RPC2|tvCategory|Series
    {{ end }}
    {{ if include "kubarr-common.storage.hasDownloadClient" (dict "mounts" .Values.storage.mounts "client" "sabnzbd") }}
    SABnzbd|Sabnzbd|sabnzbd.sabnzbd.svc.cluster.local|8080|/sabnzbd/api?mode=version&apikey=${SABNZBD_API_KEY}|tvCategory|tv
    {{ end }}
    "

    get_api_key() {
      sed -n 's/.*<ApiKey>\([^<]*\)<\/ApiKey>.*/\1/p' "$CONFIG_FILE" 2>/dev/null
    }

    is_api_ready() {
      local api_key="$1"
      curl -s -f -H "X-Api-Key: $api_key" "http://localhost:$API_PORT$API_BASE/api/v3/system/status" > /dev/null 2>&1
    }

    is_client_available() {
      local host="$1"
      local port="$2"
      local check_path="$3"
      # For XMLRPC endpoints (like ruTorrent), use POST with a simple call
      if [ "$check_path" = "/RPC2" ]; then
        curl -s -f --connect-timeout 3 -X POST \
          -H "Content-Type: text/xml" \
          -d '<?xml version="1.0"?><methodCall><methodName>system.listMethods</methodName></methodCall>' \
          "http://$host:$port$check_path" > /dev/null 2>&1
      else
        curl -s -f --connect-timeout 3 "http://$host:$port$check_path" > /dev/null 2>&1
      fi
    }

    get_client_id() {
      local api_key="$1"
      local implementation="$2"
      curl -s -H "X-Api-Key: $api_key" "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" 2>/dev/null | \
        jq -r ".[] | select(.implementation == \"$implementation\") | .id" | head -1
    }

    ensure_qbittorrent_path_mapping() {
      local api_key="$1"
      local host="$2"
      local endpoint="http://localhost:$API_PORT$API_BASE/api/v3/remotepathmapping"
      local mappings payload

      # The client reports /downloads, but this app mounts that same NFS
      # directory at /downloads/qbittorrent. Reconcile on every pass so existing
      # clients are repaired too, without replacing a user's mapping.
      mappings=$(curl -fsS --connect-timeout 3 --max-time 10 \
        -H "X-Api-Key: $api_key" "$endpoint") || return 1
      echo "$mappings" | jq -e 'type == "array"' > /dev/null || return 1
      if echo "$mappings" | jq -e --arg host "$host" '
        any(.[]; ((.host // "" | ascii_downcase) == ($host | ascii_downcase))
          and ((.remotePath // "" | rtrimstr("/")) == "/downloads"))
      ' > /dev/null; then
        return 0
      fi

      payload=$(jq -nc --arg host "$host" \
        '{host: $host, remotePath: "/downloads/", localPath: "/downloads/qbittorrent/"}') || return 1
      curl -fsS --connect-timeout 3 --max-time 10 -X POST \
        -H "X-Api-Key: $api_key" -H "Content-Type: application/json" \
        "$endpoint" -d "$payload" > /dev/null || return 1
      echo "[setup] Configured qBittorrent download path mapping"
    }

    add_qbittorrent() {
      local api_key="$1"
      local host="$2"
      local port="$3"
      curl -s -X POST \
        -H "X-Api-Key: $api_key" \
        -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" \
        -d '{
          "name": "qBittorrent",
          "implementation": "QBittorrent",
          "configContract": "QBittorrentSettings",
          "protocol": "torrent",
          "enable": true,
          "priority": 1,
          "fields": [
            {"name": "host", "value": "'"$host"'"},
            {"name": "port", "value": '"$port"'},
            {"name": "useSsl", "value": false},
            {"name": "tvCategory", "value": "Series"}
          ]
        }'
    }

    add_transmission() {
      local api_key="$1"
      local host="$2"
      local port="$3"
      curl -s -X POST \
        -H "X-Api-Key: $api_key" \
        -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" \
        -d '{
          "name": "Transmission",
          "implementation": "Transmission",
          "configContract": "TransmissionSettings",
          "protocol": "torrent",
          "enable": true,
          "priority": 1,
          "fields": [
            {"name": "host", "value": "'"$host"'"},
            {"name": "port", "value": '"$port"'},
            {"name": "useSsl", "value": false},
            {"name": "urlBase", "value": "/transmission/"},
            {"name": "tvCategory", "value": "Series"}
          ]
        }'
    }

    add_deluge() {
      local api_key="$1"
      local host="$2"
      local port="$3"
      curl -s -X POST \
        -H "X-Api-Key: $api_key" \
        -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" \
        -d '{
          "name": "Deluge",
          "implementation": "Deluge",
          "configContract": "DelugeSettings",
          "protocol": "torrent",
          "enable": true,
          "priority": 1,
          "fields": [
            {"name": "host", "value": "'"$host"'"},
            {"name": "port", "value": '"$port"'},
            {"name": "useSsl", "value": false}
          ]
        }'
    }

    add_rutorrent() {
      local api_key="$1"
      local host="$2"
      local port="$3"
      curl -s -X POST \
        -H "X-Api-Key: $api_key" \
        -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" \
        -d '{
          "name": "ruTorrent",
          "implementation": "RTorrent",
          "configContract": "RTorrentSettings",
          "protocol": "torrent",
          "enable": true,
          "priority": 1,
          "fields": [
            {"name": "host", "value": "'"$host"'"},
            {"name": "port", "value": '"$port"'},
            {"name": "useSsl", "value": false},
            {"name": "urlBase", "value": "/RPC2"},
            {"name": "tvCategory", "value": "Series"}
          ]
        }'
    }

    add_sabnzbd() {
      local api_key="$1"
      local host="$2"
      local port="$3"
      curl -s -X POST \
        -H "X-Api-Key: $api_key" \
        -H "Content-Type: application/json" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient" \
        -d '{
          "name": "SABnzbd",
          "implementation": "Sabnzbd",
          "configContract": "SabnzbdSettings",
          "protocol": "usenet",
          "enable": true,
          "priority": 1,
          "fields": [
            {"name": "host", "value": "'"$host"'"},
            {"name": "port", "value": '"$port"'},
            {"name": "useSsl", "value": false},
            {"name": "apiKey", "value": "'"$SABNZBD_API_KEY"'"},
            {"name": "tvCategory", "value": "tv"},
            {"name": "recentTvPriority", "value": -100},
            {"name": "olderTvPriority", "value": -100}
          ]
        }'
    }

    add_client() {
      local api_key="$1"
      local name="$2"
      local host="$3"
      local port="$4"

      case "$name" in
        qBittorrent) add_qbittorrent "$api_key" "$host" "$port" ;;
        Transmission) add_transmission "$api_key" "$host" "$port" ;;
        Deluge) add_deluge "$api_key" "$host" "$port" ;;
        ruTorrent) add_rutorrent "$api_key" "$host" "$port" ;;
        SABnzbd) add_sabnzbd "$api_key" "$host" "$port" ;;
      esac
    }

    remove_client() {
      local api_key="$1"
      local client_id="$2"
      curl -s -X DELETE -H "X-Api-Key: $api_key" \
        "http://localhost:$API_PORT$API_BASE/api/v3/downloadclient/$client_id"
    }

    echo "[setup] Starting download client manager for Sonarr..."

    # Wait for config file and API key
    echo "[setup] Waiting for Sonarr to be ready..."
    while true; do
      API_KEY=$(get_api_key)
      if [ -n "$API_KEY" ] && is_api_ready "$API_KEY"; then
        echo "[setup] Sonarr API is ready"
        break
      fi
      sleep 2
    done

    # Main loop - continuously monitor download client availability
    while true; do
      API_KEY=$(get_api_key)

      if ! is_api_ready "$API_KEY"; then
        sleep $CHECK_INTERVAL
        continue
      fi

      # Process each client
      echo "$CLIENTS" | while IFS='|' read -r name implementation host port check_path category_field category_value; do
        # Skip empty lines
        [ -z "$name" ] && continue

        # Trim whitespace
        name=$(echo "$name" | tr -d ' ')
        implementation=$(echo "$implementation" | tr -d ' ')
        host=$(echo "$host" | tr -d ' ')
        port=$(echo "$port" | tr -d ' ')
        check_path=$(echo "$check_path" | tr -d ' ')

        available=$(is_client_available "$host" "$port" "$check_path" && echo "yes" || echo "no")
        if [ "$name" = "qBittorrent" ] && [ "$available" = "yes" ]; then
          if ! ensure_qbittorrent_path_mapping "$API_KEY" "$host"; then
            echo "[setup] Could not configure qBittorrent path mapping; retrying next pass"
            continue
          fi
        fi
        client_id=$(get_client_id "$API_KEY" "$implementation")
        exists=$([ -n "$client_id" ] && echo "yes" || echo "no")

        if [ "$available" = "yes" ] && [ "$exists" = "no" ]; then
          echo "[setup] $name is available, adding as download client..."
          response=$(add_client "$API_KEY" "$name" "$host" "$port")
          if echo "$response" | grep -q '"id"'; then
            echo "[setup] Successfully added $name"
          else
            echo "[setup] Failed to add $name"
          fi
        elif [ "$available" = "no" ] && [ "$exists" = "yes" ]; then
          echo "[setup] $name is no longer available, removing..."
          remove_client "$API_KEY" "$client_id"
          echo "[setup] Removed $name"
        fi
      done

      sleep $CHECK_INTERVAL
    done
