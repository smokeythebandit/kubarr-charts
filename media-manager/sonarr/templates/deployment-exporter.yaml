{{- if .Values.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarr.fullname" . }}-exporter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sonarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sonarr.name" . }}-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sonarr.name" . }}-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.exporter.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-sonarr-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.sonarr.image.repository }}:{{ .Values.sonarr.image.tag }}"
          imagePullPolicy: {{ .Values.sonarr.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              attempts="${SONARR_CONFIG_WAIT_ATTEMPTS:-150}"
              interval="${SONARR_CONFIG_WAIT_INTERVAL:-2}"
              config_file="${SONARR_CONFIG_FILE:-/config/config.xml}"
              attempt=0
              sleep_pid=""
              terminated=false

              trap 'terminated=true; if [ -n "$sleep_pid" ]; then kill "$sleep_pid" 2>/dev/null || true; fi' TERM INT

              while [ "$attempt" -lt "$attempts" ]; do
                if [ -r "$config_file" ]; then
                  api_key="$(sed -n 's|.*<ApiKey>\([^<]*\)</ApiKey>.*|\1|p' "$config_file")" || {
                    status=$?
                    echo "Failed to read Sonarr configuration" >&2
                    exit "$status"
                  }
                  case "$api_key" in
                    ""|*[!A-Za-z0-9]*) ;;
                    *) exit 0 ;;
                  esac
                fi

                attempt=$((attempt + 1))
                if [ "$attempt" -ge "$attempts" ]; then
                  break
                fi
                sleep "$interval" &
                sleep_pid=$!
                if wait "$sleep_pid"; then
                  sleep_pid=""
                else
                  status=$?
                  if "$terminated"; then
                    exit 143
                  fi
                  exit "$status"
                fi
              done

              echo "Timed out waiting for Sonarr to generate its API key" >&2
              exit 1
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config" "readOnly" true) | nindent 12 }}
      containers:
        - name: exportarr
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - sonarr
            - --config=/config/config.xml
          env:
            - name: PORT
              value: "{{ .Values.exporter.port }}"
            - name: URL
              value: "http://{{ include "sonarr.fullname" . }}.{{ .Values.namespace.name }}.svc.cluster.local:{{ .Values.sonarr.service.port }}"
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config" "readOnly" true) | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
      volumes:
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "sonarr.fullname" .)) | nindent 8 }}
{{- end }}
