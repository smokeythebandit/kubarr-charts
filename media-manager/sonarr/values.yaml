# Default values for sonarr
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  name: sonarr

# Sonarr application configuration
sonarr:
  replicaCount: 1

  image:
    repository: linuxserver/sonarr
    pullPolicy: IfNotPresent
    tag: "4.0.19"

  # Service configuration
  service:
    type: ClusterIP
    port: 8989
    targetPort: 8989
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Base path for reverse proxy (e.g., /sonarr)
  basePath: "/sonarr"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 8989
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 8989
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: sonarr
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage configuration. All app storage is routed through the shared NFS claim.
storage:
  media:
    existingClaim: media-data
    mediaMountPath: /media
    downloadsMountPath: /downloads
    configMountPath: /config
    configSubPath: config/sonarr
    mediaSubPath: media
    downloadsSubPath: downloads

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  # Name of the Kubernetes secret containing VPN credentials
  # Created by Kubarr when you configure VPN in Settings > Networking
  secretName: ""
  # Gluetun container image
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  # Resource limits for Gluetun container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kill switch - block all traffic if VPN disconnects
  killSwitch: true
  # Optional narrow subnets reachable outside the VPN tunnel
  firewallOutboundSubnets: ""
  # Additional environment variables for Gluetun (for example, health or DNS settings)
  extraEnv: []
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""

# Network policy configuration
networkPolicy:
  enabled: true
  # Permit only this release's exporter pod to call the app API in this namespace
  allowExporterIngress: true
  # Namespaces allowed to send traffic to this app
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - victoriametrics  # metrics scraping
  # Namespaces this app can send traffic to
  egressTo:
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - sabnzbd
    - jackett

# Metrics exporter (exportarr) - auto-scraped by VictoriaMetrics
# Note: Requires API key from Sonarr (Settings > General > API Key)
exporter:
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    tag: "v2.3.0"
    pullPolicy: IfNotPresent
  port: 9707
  # API key from Sonarr (Settings > General > API Key)
  # Can be set via secret or directly
  apiKey: ""
  # Or reference an existing secret
  apiKeySecret:
    name: ""
    key: "api-key"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
