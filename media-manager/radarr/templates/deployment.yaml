apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radarr.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "radarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.radarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "radarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/setup: {{ include (print $.Template.BasePath "/setup-configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "radarr.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "radarr.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "kubarr-common.storage.prepareMounts" (dict "root" . "uid" .Values.radarr.env.PUID "gid" .Values.radarr.env.PGID) | nindent 8 }}
        - name: init-config
          image: busybox:1.38.0
          securityContext:
            runAsUser: {{ .Values.radarr.env.PUID | int }}
            runAsGroup: {{ .Values.radarr.env.PGID | int }}
            runAsNonRoot: {{ ne (int .Values.radarr.env.PUID) 0 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              mkdir -p /config
              CONFIG_FILE="/config/config.xml"
              if [ ! -f "$CONFIG_FILE" ]; then
                # Create initial config
                cat > "$CONFIG_FILE" << 'EOF'
              <Config>
                <UrlBase>{{ .Values.radarr.basePath }}</UrlBase>
                <BindAddress>*</BindAddress>
                <Port>7878</Port>
                <EnableSsl>False</EnableSsl>
                <AuthenticationMethod>External</AuthenticationMethod>
                <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>
              </Config>
              EOF
              else
                # Update existing config to disable authentication
                echo "Updating authentication settings in existing config..."
                # Update AuthenticationMethod to External
                if grep -q "<AuthenticationMethod>" "$CONFIG_FILE"; then
                  sed -i 's|<AuthenticationMethod>[^<]*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <AuthenticationMethod>External</AuthenticationMethod>\n</Config>|' "$CONFIG_FILE"
                fi
                # Update AuthenticationRequired
                if grep -q "<AuthenticationRequired>" "$CONFIG_FILE"; then
                  sed -i 's|<AuthenticationRequired>[^<]*</AuthenticationRequired>|<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>\n</Config>|' "$CONFIG_FILE"
                fi
                {{- if .Values.radarr.basePath }}
                # Ensure UrlBase is set
                if grep -q "<UrlBase>" "$CONFIG_FILE"; then
                  sed -i 's|<UrlBase>[^<]*</UrlBase>|<UrlBase>{{ .Values.radarr.basePath }}</UrlBase>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <UrlBase>{{ .Values.radarr.basePath }}</UrlBase>\n</Config>|' "$CONFIG_FILE"
                fi
                {{- end }}
              fi
              echo "Config file contents:"
              cat "$CONFIG_FILE"
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config") | nindent 12 }}
        {{- include "kubarr-common.gluetun.initContainer" (dict "root" .) | nindent 8 }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.radarr.service.targetPort "inputPorts" (ternary (toString .Values.exporter.port) "" .Values.exporter.enabled)) | nindent 8 }}
        - name: radarr
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.radarr.image.repository }}:{{ .Values.radarr.image.tag }}"
          imagePullPolicy: {{ .Values.radarr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.radarr.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "radarr.fullname" . }}-config
          {{- if .Values.radarr.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.radarr.livenessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.radarr.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.radarr.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.radarr.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.radarr.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.radarr.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.radarr.readinessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.radarr.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.radarr.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.radarr.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.radarr.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.radarr.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.appMounts" (dict "root" . "reservedPaths" (dig "storage" "reserved" "main" (list) (default dict .Values.kubarr))) | nindent 12 }}
            - name: setup-scripts
              mountPath: /custom-services.d/setup-downloadclients
              subPath: setup-downloadclients.sh
            - name: setup-scripts
              mountPath: /custom-services.d/setup-indexers
              subPath: setup-indexers.sh
            - name: setup-scripts
              mountPath: /custom-services.d/setup-mediaservers
              subPath: setup-mediaservers.sh
            {{- if (default dict .Values.jellyfinIntegration).secretName }}
            - name: jellyfin-api-key
              mountPath: /kubarr-secrets/jellyfin
              readOnly: true
            {{- end }}
            {{- if (default dict .Values.sabnzbdIntegration).secretName }}
            - name: sabnzbd-api-key
              mountPath: /kubarr-secrets/sabnzbd
              readOnly: true
            {{- end }}
            - name: setup-scripts
              mountPath: /custom-services.d/setup-prowlarr
              subPath: setup-prowlarr.sh
            {{- if (default dict .Values.prowlarrIntegration).secretName }}
            - name: prowlarr-api-key
              mountPath: /kubarr-secrets/prowlarr
              readOnly: true
            {{- end }}
            - name: setup-scripts
              mountPath: /custom-services.d/setup-bazarr
              subPath: setup-bazarr.sh
            {{- if (default dict .Values.bazarrIntegration).secretName }}
            - name: bazarr-api-key
              mountPath: /kubarr-secrets/bazarr
              readOnly: true
            {{- end }}
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "radarr.fullname" .)) | nindent 8 }}
        - name: setup-scripts
          configMap:
            name: {{ include "radarr.fullname" . }}-setup
            defaultMode: 0755
        {{- if (default dict .Values.jellyfinIntegration).secretName }}
        - name: jellyfin-api-key
          secret:
            secretName: {{ (default dict .Values.jellyfinIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
        {{- if (default dict .Values.sabnzbdIntegration).secretName }}
        - name: sabnzbd-api-key
          secret:
            secretName: {{ (default dict .Values.sabnzbdIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
        {{- if (default dict .Values.prowlarrIntegration).secretName }}
        - name: prowlarr-api-key
          secret:
            secretName: {{ (default dict .Values.prowlarrIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
        {{- if (default dict .Values.bazarrIntegration).secretName }}
        - name: bazarr-api-key
          secret:
            secretName: {{ (default dict .Values.bazarrIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
      {{- include "kubarr-common.gluetun.dnsConfig" (dict "root" .) | nindent 6 }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
