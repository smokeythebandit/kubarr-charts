# Default values for radarr
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  name: radarr

# Radarr application configuration
radarr:
  replicaCount: 1

  image:
    repository: linuxserver/radarr
    pullPolicy: IfNotPresent
    tag: "6.4.4"

  # Service configuration
  service:
    type: ClusterIP
    port: 7878
    targetPort: 7878
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Base path for reverse proxy (e.g., /radarr)
  basePath: "/radarr"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 7878
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 7878
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: radarr
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main:
        - "/config"
        - "/custom-services.d/setup-downloadclients"
        - "/custom-services.d/setup-indexers"
        - "/custom-services.d/setup-mediaservers"
        - "/custom-services.d/setup-prowlarr"
        - "/custom-services.d/setup-bazarr"
        - "/kubarr-secrets/jellyfin"
        - "/kubarr-secrets/sabnzbd"
        - "/kubarr-secrets/prowlarr"
        - "/kubarr-secrets/bazarr"

storage:
  mounts:
    - {name: library, source: media/movies, target: /media/movies, mode: read-write}
    - {name: qbittorrent, source: downloads/qbittorrent, target: /downloads/qbittorrent, mode: read-write}
    - {name: transmission, source: downloads/transmission, target: /downloads/transmission, mode: read-write}
    - {name: deluge, source: downloads/deluge, target: /downloads/deluge, mode: read-write}
    - {name: rutorrent, source: downloads/rutorrent, target: /downloads/rutorrent, mode: read-write}
    - {name: sabnzbd, source: downloads/sabnzbd, target: /downloads/sabnzbd, mode: read-write}
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass (not managed NFS)
  media:
    existingClaim: media-data

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  # Name of the Kubernetes secret containing VPN credentials
  # Created by Kubarr when you configure VPN in Settings > Networking
  secretName: ""
  # Gluetun container image
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  # Resource limits for Gluetun container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kill switch - block all traffic if VPN disconnects
  killSwitch: true
  # Subnets to allow even when VPN is active (for cluster internal communication)
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""
  # Server picker: chooses the fastest VPN server before gluetun starts and
  # re-evaluates it while the pod runs. Reads fall back to these defaults.
  picker:
    enabled: true
    shortlist: 5
    sample: 40
    initBudget: 60s
    testSeconds: 8
    testEndpoints:
      - https://proof.ovh.net/files/100Mb.dat
      - http://speedtest.tele2.net/100MB.zip
    interval: 15m
    degradeThreshold: 0.4
    degradeChecks: 3
    cooldown: 6h
    switchWhileRunning: true
    image:
      repository: ghcr.io/smokeythebandit/kubarr-vpn-picker
      tag: main
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Network policy configuration
networkPolicy:
  enabled: true
  # Permit only this release's exporter pod to call the app API in this namespace
  allowExporterIngress: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - victoriametrics  # metrics scraping
    - jellyseerr  # request manager adds movies/series
    - bazarr  # subtitle manager reads the library and queues searches
    - prowlarr  # indexer manager syncs indexer definitions in
    - recyclarr  # quality profile sync
  egressTo:
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - sabnzbd
    - jackett
    - prowlarr  # indexer manager syncs indexer definitions in
    - bazarr  # switches itself on in the subtitle manager

# Jellyfin connection. Kubarr sets secretName to a Secret (key: api-key) holding
# the API key it also registers in Jellyfin; Radarr then adds a Jellyfin
# connection so imports refresh the library. Empty disables it.
jellyfinIntegration:
  secretName: ""

# SABnzbd download client. Kubarr sets secretName to a Secret (key: api-key)
# holding the API key it also writes into SABnzbd's own configuration, so this
# service can authenticate to it. Empty means Kubarr supplied no key, and the
# SABnzbd download client is then left unconfigured.
sabnzbdIntegration:
  secretName: ""

# Prowlarr link. Kubarr sets secretName to a Secret (key: api-key) holding the
# API key it also writes into Prowlarr's configuration; Radarr then registers
# itself in Prowlarr as an application, and Prowlarr pushes its indexers here.
# Empty leaves the registration off.
prowlarrIntegration:
  secretName: ""

# Bazarr link. Kubarr sets secretName to a Secret (key: api-key) holding the
# API key it also writes into Bazarr's configuration; Radarr then switches
# itself on in Bazarr, so Bazarr fetches subtitles for its library. Empty
# leaves the connection off.
bazarrIntegration:
  secretName: ""

# Metrics exporter (exportarr) - auto-scraped by VictoriaMetrics
# Note: Requires API key from Radarr (Settings > General > API Key)
exporter:
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    tag: "v2.3.0"
    pullPolicy: IfNotPresent
  port: 9708
  # API key from Radarr (Settings > General > API Key)
  # Can be set via secret or directly
  apiKey: ""
  # Or reference an existing secret
  apiKeySecret:
    name: ""
    key: "api-key"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
