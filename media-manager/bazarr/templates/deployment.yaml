apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bazarr.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "bazarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bazarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bazarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        kubarr.io/bazarr-link: {{ (default dict .Values.bazarrIntegration).secretName | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bazarr.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bazarr.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "kubarr-common.storage.prepareMounts" (dict "root" . "uid" .Values.bazarr.env.PUID "gid" .Values.bazarr.env.PGID) | nindent 8 }}
        - name: init-config
          image: busybox:1.38.0
          securityContext:
            runAsUser: {{ .Values.bazarr.env.PUID | int }}
            runAsGroup: {{ .Values.bazarr.env.PGID | int }}
            runAsNonRoot: {{ ne (int .Values.bazarr.env.PUID) 0 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              # Bazarr keeps a YAML configuration, not the *arr config.xml, and
              # merges its own defaults into whatever this file holds.
              mkdir -p /config/config
              CONFIG_FILE="/config/config/config.yaml"
              BASE_URL={{ .Values.bazarr.basePath | quote }}
              BASE_LINE="base_url: \"$BASE_URL\""
              if [ ! -f "$CONFIG_FILE" ]; then
                # Create initial config
                printf 'general:\n  ip: 0.0.0.0\n  port: %s\n  %s\n' \
                  "6767" "$BASE_LINE" > "$CONFIG_FILE"
              else
                # Keep the reverse-proxy prefix pinned, leaving the rest alone.
                # Only general.base_url: the sonarr and radarr sections carry
                # their own base_url, the prefix Bazarr uses to reach them.
                echo "Updating the base URL in the existing config..."
                if grep -q '^general:' "$CONFIG_FILE"; then
                  awk -v line="$BASE_LINE" '
                    /^general:/ { print; ingeneral = 1; next }
                    ingeneral && /^[^ ]/ { if (!done) print "  " line; ingeneral = 0; done = 1 }
                    ingeneral && /^  base_url:/ { print "  " line; done = 1; next }
                    { print }
                    END { if (ingeneral && !done) print "  " line }
                  ' "$CONFIG_FILE" > "$CONFIG_FILE.tmp" && mv "$CONFIG_FILE.tmp" "$CONFIG_FILE"
                else
                  printf 'general:\n  %s\n' "$BASE_LINE" >> "$CONFIG_FILE"
                fi
              fi
              {{- if (default dict .Values.bazarrIntegration).secretName }}
              # Kubarr's key, shared with Sonarr and Radarr so they can switch
              # themselves on here before Bazarr ever generated a key.
              KEY=$(tr -d '[:space:]' < /kubarr-secrets/bazarr/api-key)
              if grep -q '^auth:' "$CONFIG_FILE"; then
                awk -v key="$KEY" '
                  /^auth:/ { print; inauth = 1; next }
                  inauth && /^[^ ]/ { if (!done) print "  apikey: " key; inauth = 0; done = 1 }
                  inauth && /^  apikey:/ { print "  apikey: " key; done = 1; next }
                  { print }
                  END { if (inauth && !done) print "  apikey: " key }
                ' "$CONFIG_FILE" > "$CONFIG_FILE.tmp" && mv "$CONFIG_FILE.tmp" "$CONFIG_FILE"
              else
                printf 'auth:\n  apikey: %s\n' "$KEY" >> "$CONFIG_FILE"
              fi
              {{- end }}
              echo "Config file contents:"
              sed 's|^\([[:space:]]*apikey:\).*|\1 (hidden)|' "$CONFIG_FILE"
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config") | nindent 12 }}
            {{- if (default dict .Values.bazarrIntegration).secretName }}
            - name: bazarr-api-key
              mountPath: /kubarr-secrets/bazarr
              readOnly: true
            {{- end }}
        {{- include "kubarr-common.gluetun.initContainer" (dict "root" .) | nindent 8 }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.bazarr.service.targetPort) | nindent 8 }}
        - name: bazarr
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.bazarr.image.repository }}:{{ .Values.bazarr.image.tag }}"
          imagePullPolicy: {{ .Values.bazarr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bazarr.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bazarr.fullname" . }}-config
          {{- if .Values.bazarr.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.bazarr.livenessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.bazarr.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.bazarr.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.bazarr.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.bazarr.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.bazarr.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.bazarr.readinessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.bazarr.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.bazarr.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.bazarr.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.bazarr.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.bazarr.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.appMounts" (dict "root" . "reservedPaths" (dig "storage" "reserved" "main" (list) (default dict .Values.kubarr))) | nindent 12 }}
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "bazarr.fullname" .)) | nindent 8 }}
        {{- if (default dict .Values.bazarrIntegration).secretName }}
        - name: bazarr-api-key
          secret:
            secretName: {{ (default dict .Values.bazarrIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
