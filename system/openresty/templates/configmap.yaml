{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openresty.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "openresty.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /usr/local/openresty/nginx/conf/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_body_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      sendfile on;

      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      upstream kubarr_api {
        server {{ .Values.backend.service.name }}.{{ .Values.backend.service.namespace }}.svc.cluster.local:{{ .Values.backend.service.port }};
      }

      upstream kubarr_frontend {
        server {{ .Values.frontend.service.name }}.{{ .Values.frontend.service.namespace }}.svc.cluster.local:{{ .Values.frontend.service.port }};
      }

      server {
        listen {{ .Values.service.port }};
        server_name _;

        location = /healthz {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        location /api/ {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://kubarr_api;
        }

        location /auth/ {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://kubarr_api;
        }

        location ~ ^/_kubarr_app_auth/(?<auth_app_name>[a-z0-9-]+)$ {
          internal;
          proxy_pass http://kubarr_api/api/proxy-auth/$auth_app_name;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-Original-URI $request_uri;
        }

        location = /_kubarr_route_lookup {
          internal;
          proxy_pass http://kubarr_api/api/proxy-auth/route?host=$arg_host&path=$arg_path;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-Original-URI $request_uri;
        }

        location ~ ^/_kubarr_catalog_lookup/(?<catalog_app_name>[a-z0-9-]+)$ {
          internal;
          proxy_pass http://kubarr_api/api/apps/catalog/$catalog_app_name;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-Original-URI $request_uri;
        }

        location ~ ^/(?<absolute_app_path>(:|activities|api/v1|css|js|themes|render|json|images|icons|ui_images|media|status|updater|gettext\.js|_next|web|site\.webmanifest|logo_stacked\.svg|apple-[^/]+|favicon-[^/]+)(/.*)?)$ {
          set $app_name "";
          set $app_upstream "";
          set $app_base_path "";
          set $target_path "";

          access_by_lua_block {
            -- Subdomain-routed apps (host assignments) resolve by host first;
            -- referer matching below only covers path-based app access.
            local route = ngx.location.capture("/_kubarr_route_lookup", {
              args = { host = ngx.var.host, path = ngx.var.request_uri }
            })
            if route.status == ngx.HTTP_OK or route.status == ngx.HTTP_NO_CONTENT then
              local routed_app = route.header["x-kubarr-app-name"]
              local routed_upstream = route.header["x-kubarr-upstream"]
              if routed_app and routed_app ~= "" and routed_upstream and routed_upstream ~= "" then
                ngx.var.app_name = routed_app
                ngx.var.app_upstream = routed_upstream
                ngx.var.app_base_path = route.header["x-kubarr-base-path"] or ""
                ngx.var.target_path = "/" .. ngx.var.absolute_app_path
                return
              end
            end

            local referer = ngx.var.http_referer or ""
            local host = ngx.var.host:gsub("%.", "%%.")
            local app_name = referer:match("^https?://" .. host .. ":?%d*/([a-z0-9-]+)/")
            if (not app_name or app_name == "") and ngx.var.absolute_app_path:sub(1, 1) == ":" then
              app_name = "plex"
            end
            if not app_name or app_name == "" then
              return ngx.exit(ngx.HTTP_NOT_FOUND)
            end

            ngx.var.app_name = app_name
            local auth = ngx.location.capture("/_kubarr_app_auth/" .. app_name)
            if auth.status == ngx.HTTP_UNAUTHORIZED or auth.status == ngx.HTTP_FORBIDDEN then
              return ngx.exit(auth.status)
            end
            if auth.status == ngx.HTTP_NOT_FOUND then
              return ngx.redirect("/app-error?app=" .. ngx.escape_uri(app_name) .. "&reason=not_found", ngx.HTTP_MOVED_TEMPORARILY)
            end
            if auth.status == ngx.HTTP_INTERNAL_SERVER_ERROR or auth.status == ngx.HTTP_BAD_GATEWAY
                or auth.status == ngx.HTTP_SERVICE_UNAVAILABLE or auth.status == ngx.HTTP_GATEWAY_TIMEOUT then
              return ngx.redirect("/app-error?app=" .. ngx.escape_uri(app_name) .. "&reason=connection_failed", ngx.HTTP_MOVED_TEMPORARILY)
            end
            if auth.status < 200 or auth.status >= 300 then
              ngx.log(ngx.ERR, "absolute app path auth failed with status ", auth.status)
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            local upstream = auth.header["x-kubarr-upstream"]
            if not upstream or upstream == "" then
              ngx.log(ngx.ERR, "app auth response missing x-kubarr-upstream")
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            ngx.var.app_upstream = upstream
            ngx.var.app_base_path = auth.header["x-kubarr-base-path"] or ""
            ngx.var.target_path = "/" .. ngx.var.absolute_app_path
          }

          proxy_http_version 1.1;
          proxy_intercept_errors on;
          error_page 502 503 504 = @app_connection_failed;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Prefix /$app_name;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_redirect off;
          proxy_pass $app_upstream$target_path$is_args$args;
        }

        location ~ ^/(?!(api|auth|assets|login|account|settings|users|storage|resources|apps|monitoring|logs|networking|security|app-error|favicon\.svg)(/|$))(?<app_name>[a-z0-9-]+)(?<app_path>/.*)?$ {
          set $app_upstream "";
          set $app_base_path "";
          set $target_path "";

          access_by_lua_block {
            local route = ngx.location.capture("/_kubarr_route_lookup", {
              args = { host = ngx.var.host, path = ngx.var.uri }
            })

            if route.status == ngx.HTTP_OK or route.status == ngx.HTTP_NO_CONTENT then
              local app_name = route.header["x-kubarr-app-name"]
              local upstream = route.header["x-kubarr-upstream"]
              local target_path = route.header["x-kubarr-target-path"] or ngx.var.uri
              if not app_name or app_name == "" or not upstream or upstream == "" then
                ngx.log(ngx.ERR, "route lookup response missing app/upstream headers")
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
              end

              ngx.var.app_name = app_name
              ngx.var.app_upstream = upstream
              ngx.var.app_base_path = route.header["x-kubarr-base-path"] or ""
              ngx.var.target_path = target_path
              return
            end

            if route.status == ngx.HTTP_UNAUTHORIZED or route.status == ngx.HTTP_FORBIDDEN then
              return ngx.exit(route.status)
            end

            if route.status ~= ngx.HTTP_NOT_FOUND then
              ngx.log(ngx.ERR, "route lookup failed with status ", route.status)
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            local auth = ngx.location.capture("/_kubarr_app_auth/" .. ngx.var.app_name)
            if auth.status == ngx.HTTP_UNAUTHORIZED or auth.status == ngx.HTTP_FORBIDDEN then
              return ngx.exit(auth.status)
            end
            if auth.status == ngx.HTTP_NOT_FOUND then
              local catalog = ngx.location.capture("/_kubarr_catalog_lookup/" .. ngx.var.app_name)
              if catalog.status == ngx.HTTP_NOT_FOUND then
                return ngx.exec('@frontend_index')
              end
              if catalog.status == ngx.HTTP_OK then
                return ngx.redirect("/app-error?app=" .. ngx.escape_uri(ngx.var.app_name) .. "&reason=not_found", ngx.HTTP_MOVED_TEMPORARILY)
              end
              if catalog.status == ngx.HTTP_UNAUTHORIZED or catalog.status == ngx.HTTP_FORBIDDEN then
                return ngx.exit(catalog.status)
              end
              ngx.log(ngx.ERR, "app catalog lookup failed with status ", catalog.status)
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end
            if auth.status == ngx.HTTP_INTERNAL_SERVER_ERROR or auth.status == ngx.HTTP_BAD_GATEWAY
                or auth.status == ngx.HTTP_SERVICE_UNAVAILABLE or auth.status == ngx.HTTP_GATEWAY_TIMEOUT then
              return ngx.redirect("/app-error?app=" .. ngx.escape_uri(ngx.var.app_name) .. "&reason=connection_failed", ngx.HTTP_MOVED_TEMPORARILY)
            end
            if auth.status < 200 or auth.status >= 300 then
              ngx.log(ngx.ERR, "app auth failed with status ", auth.status)
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            local upstream = auth.header["x-kubarr-upstream"]
            if not upstream or upstream == "" then
              ngx.log(ngx.ERR, "app auth response missing x-kubarr-upstream")
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end
            ngx.var.app_upstream = upstream

            local base_path = auth.header["x-kubarr-base-path"] or ""
            ngx.var.app_base_path = base_path
            local landing_path = auth.header["x-kubarr-landing-path"] or ""

            local app_path = ngx.var.app_path
            if not app_path or app_path == "" then
              app_path = "/"
            end

            if app_path == "/" and landing_path ~= "" then
              return ngx.redirect("/" .. ngx.var.app_name .. landing_path, ngx.HTTP_MOVED_TEMPORARILY)
            end

            if base_path == "/" .. ngx.var.app_name then
              ngx.var.target_path = ngx.var.uri
            else
              ngx.var.target_path = app_path
            end
          }

          proxy_http_version 1.1;
          proxy_intercept_errors on;
          error_page 502 503 504 = @app_connection_failed;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Prefix /$app_name;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_redirect off;
          header_filter_by_lua_block {
            local location = ngx.header["Location"]
            if location then
              local app_prefix = "/" .. ngx.var.app_name
              local path = location:match("^https?://[^/]+(/.*)$") or location
              if path:sub(1, 1) == "/" then
                local base_path = ngx.var.app_base_path
                local has_app_prefix = path == app_prefix or path:sub(1, #app_prefix + 1) == app_prefix .. "/"
                local has_base_path = base_path ~= "" and (path == base_path or path:sub(1, #base_path + 1) == base_path .. "/")

                if has_app_prefix or has_base_path then
                  ngx.header["Location"] = path
                elseif base_path == "" then
                  ngx.header["Location"] = app_prefix .. path
                end
              end
            end
          }
          body_filter_by_lua_block {
            local content_type = ngx.header["Content-Type"] or ""
            if not content_type:find("text/html", 1, true) then
              return
            end

            local chunk = ngx.arg[1]
            if not chunk or chunk == "" then
              return
            end

            local app_prefix = "/" .. ngx.var.app_name
            if ngx.var.app_base_path == "" then
              chunk = chunk:gsub('href="/', 'href="' .. app_prefix .. '/')
              chunk = chunk:gsub("href='/", "href='" .. app_prefix .. '/')
              chunk = chunk:gsub('src="/', 'src="' .. app_prefix .. '/')
              chunk = chunk:gsub("src='/", "src='" .. app_prefix .. '/')
            end
            ngx.arg[1] = chunk
          }
          proxy_pass $app_upstream$target_path$is_args$args;
        }

        location / {
          set $app_name "";
          set $app_upstream "http://{{ .Values.frontend.service.name }}.{{ .Values.frontend.service.namespace }}.svc.cluster.local:{{ .Values.frontend.service.port }}";
          set $app_base_path "";
          set $target_path $uri;

          access_by_lua_block {
            if not ngx.var.http_cookie or ngx.var.http_cookie == "" then
              return
            end

            local route = ngx.location.capture("/_kubarr_route_lookup", {
              args = { host = ngx.var.host, path = ngx.var.uri }
            })

            if route.status == ngx.HTTP_OK or route.status == ngx.HTTP_NO_CONTENT then
              local app_name = route.header["x-kubarr-app-name"]
              local upstream = route.header["x-kubarr-upstream"]
              local target_path = route.header["x-kubarr-target-path"] or ngx.var.uri
              if not app_name or app_name == "" or not upstream or upstream == "" then
                ngx.log(ngx.ERR, "route lookup response missing app/upstream headers")
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
              end

              ngx.var.app_name = app_name
              ngx.var.app_upstream = upstream
              ngx.var.app_base_path = route.header["x-kubarr-base-path"] or ""
              ngx.var.target_path = target_path
              return
            end

            if route.status == ngx.HTTP_UNAUTHORIZED or route.status == ngx.HTTP_FORBIDDEN then
              return
            end

            if route.status ~= ngx.HTTP_NOT_FOUND then
              ngx.log(ngx.ERR, "route lookup failed with status ", route.status)
              return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end
          }

          proxy_http_version 1.1;
          proxy_intercept_errors on;
          error_page 404 = @frontend_index;
          error_page 502 503 504 = @app_connection_failed;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Prefix /$app_name;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_redirect off;
          header_filter_by_lua_block {
            if ngx.var.app_name == "" then
              return
            end
            local location = ngx.header["Location"]
            if location then
              local path = location:match("^https?://[^/]+(/.*)$") or location
              if path:sub(1, 1) == "/" then
                ngx.header["Location"] = path
              end
            end
          }
          proxy_pass $app_upstream$target_path$is_args$args;
        }

        # Always serve the app status UI from Kubarr, including on custom app domains.
        location = /app-error {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Accept-Encoding "";
          rewrite ^ /index.html break;
          sub_filter '"/assets/' '"/_kubarr_assets/';
          sub_filter "'/assets/" "'/_kubarr_assets/";
          sub_filter_once off;
          proxy_pass http://kubarr_frontend;
        }

        location ^~ /_kubarr_assets/ {
          proxy_http_version 1.1;
          rewrite ^/_kubarr_assets/(.*)$ /assets/$1 break;
          proxy_set_header Host $host;
          proxy_pass http://kubarr_frontend;
        }

        location @app_connection_failed {
          content_by_lua_block {
            local app_name = ngx.var.app_name or ""
            if app_name == "" then
              return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end
            return ngx.redirect("/app-error?app=" .. ngx.escape_uri(app_name) .. "&reason=connection_failed", ngx.HTTP_MOVED_TEMPORARILY)
          }
        }

        location @frontend_index {
          proxy_http_version 1.1;
          rewrite ^ /index.html break;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://kubarr_frontend;
        }
      }
    }
{{- end }}
