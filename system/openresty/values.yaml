enabled: true
namespace:
  create: true
  name: openresty
replicaCount: 1
image:
  repository: openresty/openresty
  pullPolicy: IfNotPresent
  tag: "1.29.2.5-alpine"
compression:
  # Level 5 is the usual balance: most of the saving, little CPU.
  level: 5
  # Below this, framing overhead outweighs the saving.
  minLength: 256
lookupCache:
  # Seconds a route/authorization decision stays cached in the gateway.
  # A revoked permission takes effect within this window.
  seconds: 5
  # Shared memory for the cache; 10m holds many thousands of entries.
  size: 10m
service:
  type: NodePort
  port: 8080
  nodePort: 30080
backend:
  service:
    name: kubarr-backend
    namespace: kubarr-backend
    port: 8000
frontend:
  service:
    name: kubarr-frontend
    namespace: kubarr-frontend
    port: 80
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi
env: []
