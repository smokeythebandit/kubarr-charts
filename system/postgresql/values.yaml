namespace:
  create: true
  name: kubarr-database

image:
  repository: postgres
  tag: "16.15-alpine"
  pullPolicy: IfNotPresent

database:
  name: kubarr
  user: kubarr
  password: kubarr

service:
  port: 5432

persistence:
  size: 5Gi
  storageClassName: ""

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/var/lib/postgresql/data"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config"]

storage:
  mounts:
    - {name: postgres-data, source: system/postgresql, target: /var/lib/postgresql/data, mode: read-write}
  media:
    existingClaim: media-data

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

startupProbe:
  failureThreshold: 60
  periodSeconds: 5
  timeoutSeconds: 1

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  targetKind: StatefulSet
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
