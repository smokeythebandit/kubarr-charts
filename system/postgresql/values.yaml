namespace:
  create: true
  name: kubarr-database

image:
  repository: postgres
  tag: "16.15-alpine"
  pullPolicy: IfNotPresent

database:
  name: kubarr
  user: kubarr
  password: kubarr

service:
  port: 5432

persistence:
  size: 5Gi
  storageClassName: ""

storage:
  media:
    existingClaim: media-data
    dataSubPath: system/postgresql

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

startupProbe:
  failureThreshold: 60
  periodSeconds: 5
  timeoutSeconds: 1

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  targetKind: StatefulSet
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
