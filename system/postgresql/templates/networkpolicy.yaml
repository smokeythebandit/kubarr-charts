{{- $policy := default dict .Values.networkPolicy -}}
{{- if $policy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubarr-db
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  # Every instance the operator runs for this Cluster, primary and replicas.
  podSelector:
    matchLabels:
      cnpg.io/cluster: kubarr-db
  # Ingress only. An instance's manager talks to the Kubernetes API (which a
  # NetworkPolicy cannot select: the apiserver is host-network) and streams
  # from the primary, so restricting egress here would stop failover.
  policyTypes:
    - Ingress
  ingress:
    {{- range $policy.ingressFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # The nightly pg_dump and `kubarr db restore`, in this namespace.
    - from:
        - podSelector:
            matchLabels:
              {{- include "postgresql.backupSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # Streaming replication and the instance status endpoint between peers.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: kubarr-db
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    # The operator polls each instance's status endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default "cnpg-system" $policy.operatorNamespace }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
