{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubarr-worker
  labels:
    {{- include "kubarr-worker.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubarr-worker
  labels:
    {{- include "kubarr-worker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubarr-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "kubarr-worker.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
---
# Replicas elect a leader through this Lease; only the holder runs reconcilers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubarr-worker-leader
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubarr-worker.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubarr-worker-leader
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubarr-worker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubarr-worker-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "kubarr-worker.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
