enabled: true
namespace:
  create: true
  name: kubarr-worker
image:
  repository: ghcr.io/smokeythebandit/kubarr-worker
  pullPolicy: IfNotPresent
  tag: "0.3.11"
pollIntervalSeconds: 5
reconcileIntervalSeconds: 30
domainReconcileIntervalSeconds: 60
# Allow the worker to drain a 600-second Helm operation plus shutdown headroom.
terminationGracePeriodSeconds: 660
database:
  namespace: kubarr-database
  name: kubarr
  user: kubarr
  # No default password. These charts are public, so a password committed here
  # would be the password of every Kubarr install.
  #
  # existingSecret: name of a Secret in *this* namespace with keys `password`
  # and `uri` (postgresql://user:password@host:5432/db), created by the Kubarr
  # CLI -- a Secret is not readable across namespaces. It must equal
  # `secretName`, which is where the Deployment reads the URI from. When it is
  # set this chart renders no Secret of its own.
  #
  # Leave it empty only to let the chart template that Secret from
  # `database.password`, which you must then set. Setting neither fails
  # rendering rather than falling back to a known password.
  existingSecret: ""
  password: ""
  serviceName: kubarr-db-rw
  secretName: kubarr-db-app
# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/tmp"]

storage:
  mounts: [] # worker lifecycle needs no NFS; storage-browser workflows can explicitly mount the root
  media:
    existingClaim: media-data
serviceAccountName: kubarr
serviceAccount:
  create: true
  name: kubarr
  annotations: {}
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "create", "delete", "patch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: [""]
      resources: ["services", "serviceaccounts", "persistentvolumeclaims", "configmaps", "secrets", "endpoints"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: [""]
      resources: ["persistentvolumes"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: [""]
      resources: ["nodes", "nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods", "nodes"]
      verbs: ["get", "list"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["networkpolicies", "ingresses"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    # Several charts ship CiliumNetworkPolicies. Helm reads every resource it
    # owns before an upgrade, so without these rules an upgrade of those charts
    # fails on its own policy rather than on anything the user changed.
    - apiGroups: ["cilium.io"]
      resources:
        ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["extensions"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch", "bind", "escalate"]
    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["admissionregistration.k8s.io"]
      resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["postgresql.cnpg.io"]
      resources: ["clusters"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["cert-manager.io"]
      resources: ["certificates", "issuers", "clusterissuers", "certificaterequests"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - apiGroups: ["acme.cert-manager.io"]
      resources: ["orders", "challenges"]
      verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]
podAnnotations: {}
imagePullSecrets: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
env:
  - name: KUBARR_IN_CLUSTER
    value: "true"
  - name: KUBARR_DEFAULT_NAMESPACE
    value: "media"
  - name: KUBARR_LOG_LEVEL
    value: "INFO"
  # Pull charts from the self-hosted mirror (zot on charts.kubarr.com, anonymous
  # read). The publish workflow pushes every chart to GHCR and to the mirror.
  - name: KUBARR_CHARTS_REGISTRY
    value: "oci://charts.kubarr.com/kubarr-charts"
  - name: HOME
    value: /tmp
  - name: XDG_CACHE_HOME
    value: /tmp/.cache
  - name: HELM_CACHE_HOME
    value: /tmp/helm/cache
  - name: HELM_CONFIG_HOME
    value: /tmp/helm/config
  - name: HELM_DATA_HOME
    value: /tmp/helm/data
nodeSelector: {}
tolerations: []
affinity: {}
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
