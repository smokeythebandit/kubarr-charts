{{- $replicas := int (include "kubarr-common.ha.replicas" (dict "root" . "max" 2)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubarr-dns-webhook.name" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubarr-dns-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubarr-dns-webhook.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubarr-dns-webhook.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with include "kubarr-common.ha.spread" (dict "root" . "replicas" $replicas "selector" (include "kubarr-dns-webhook.haSelector" . | fromYaml)) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "kubarr-dns-webhook.name" . }}
      containers:
        - name: webhook
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
          args:
            - --secure-port={{ .Values.service.targetPort }}
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "kubarr-dns-webhook.name" . }}-serving-cert
