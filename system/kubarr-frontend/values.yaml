namespace:
  create: true
  name: kubarr-frontend
replicaCount: 1
image:
  repository: ghcr.io/smokeythebandit/kubarr-frontend
  pullPolicy: IfNotPresent
  tag: "0.3.0"
service:
  type: ClusterIP
  port: 80
resources:
  limits:
    cpu: 50m
    memory: 32Mi
  requests:
    cpu: 10m
    memory: 16Mi
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
