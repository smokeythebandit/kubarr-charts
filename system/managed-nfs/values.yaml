namespace:
  create: true
  name: kubarr-storage

image:
  repository: itsthenetwork/nfs-server-alpine
  tag: "12"
  pullPolicy: IfNotPresent

service:
  port: 2049

nfs:
  # kernel retains existing installs; ganesha works without a host nfsd module.
  implementation: kernel
  exportPath: /exports
  permitted: "*"
  readOnly: false
  sync: true # acknowledge writes only after stable storage; required for PostgreSQL
  hostNetwork: true

ganesha:
  image:
    repository: registry.k8s.io/sig-storage/nfs-provisioner
    tag: v4.0.8
    pullPolicy: IfNotPresent

# Bootstrap backing PVC: the NFS server cannot mount its own export.
persistence:
  claimName: managed-nfs-data
  size: 1Ti
  storageClassName: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
