{{- if not (has .Values.nfs.implementation (list "kernel" "ganesha")) -}}
{{- fail "nfs.implementation must be kernel or ganesha" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubarr-managed-nfs
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "managed-nfs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "managed-nfs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if eq .Values.nfs.implementation "ganesha" }}
      annotations:
        checksum/ganesha: {{ include (print $.Template.BasePath "/ganesha-configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "managed-nfs.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: {{ .Values.nfs.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.nfs.hostNetwork }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nfs
          {{- if eq .Values.nfs.implementation "ganesha" }}
          image: "{{ .Values.ganesha.image.repository }}:{{ .Values.ganesha.image.tag }}"
          imagePullPolicy: {{ .Values.ganesha.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - mkdir -p /var/run/ganesha /var/lib/nfs/ganesha; exec /usr/local/bin/ganesha.nfsd -F -p /var/run/ganesha/ganesha.pid -L /dev/stdout -f /etc/ganesha/ganesha.conf
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SHARED_DIRECTORY
              value: {{ .Values.nfs.exportPath | quote }}
            - name: PERMITTED
              value: {{ .Values.nfs.permitted | quote }}
            {{- if .Values.nfs.readOnly }}
            - name: READ_ONLY
              value: "true"
            {{- end }}
            {{- if .Values.nfs.sync }}
            - name: SYNC
              value: "true"
            {{- end }}
          {{- end }}
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.nfs.exportPath | quote }}
            {{- if eq .Values.nfs.implementation "ganesha" }}
            - name: ganesha-config
              mountPath: /etc/ganesha
              readOnly: true
            - name: data
              mountPath: /var/lib/nfs/ganesha
              subPath: .kubarr-nfs-recovery
            {{- end }}
      volumes:
        {{- if eq .Values.nfs.implementation "ganesha" }}
        - name: ganesha-config
          configMap:
            name: kubarr-managed-nfs-ganesha
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
