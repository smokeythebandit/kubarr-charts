{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "managed-nfs.labels" . | nindent 4 }}
    # The NFS server uses host networking and privileged filesystem access.
    # Scope this exception to its dedicated namespace, not application namespaces.
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
