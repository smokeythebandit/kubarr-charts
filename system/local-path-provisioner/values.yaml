# Vendored from rancher/local-path-provisioner v0.0.37
# (deploy/local-path-storage.yaml). The only functional changes are the data
# path (a value, below) and the namespace's Pod Security level: the helper
# pods mount hostPath volumes, which the default `baseline`/`restricted`
# levels reject.
#
# Not for Talos as-is: kubelet there needs the host directory on a Talos
# UserVolume (mounted under /var/mnt) or an rshared kubelet extraMount, so the
# Kubarr CLI refuses to install this chart on Talos and points the user at
# Talos's local storage guide instead.
namespace:
  create: true
  name: local-path-storage

image:
  repository: docker.io/rancher/local-path-provisioner
  tag: v0.0.37
  pullPolicy: IfNotPresent

# Image of the short-lived pods that create and remove volume directories.
helperImage:
  repository: docker.io/library/busybox
  tag: "1.37.0"

# The provisioner name the StorageClass hands claims to. Upstream's default, so
# volumes stay compatible with the Kubarr CLI's detection; give a second
# instance on a cluster that already runs upstream's provisioner its own name,
# or both controllers would race for the same claims.
provisionerName: rancher.io/local-path

# Directory on each node under which volumes are created. Override it to put
# volumes on a dedicated disk or mount.
dataPath: /var/local-path-provisioner

storageClass:
  name: local-path
  # Whether this StorageClass is the cluster default. The Kubarr CLI decides.
  default: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
