namespace:
  name: jenkins

jenkins:
  image:
    repository: jenkins/jenkins
    tag: 2.589-jdk21
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
  # Kubarr forwards /jenkins unchanged when the service declares this base path.
  basePath: /jenkins
  env:
    TZ: Etc/UTC
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/var/jenkins_home"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config"]

storage:
  mounts:
    - {name: home, source: development/jenkins/jenkins/home, target: /var/jenkins_home, mode: read-write}
  migrationConfirmed: false
  home:
    size: 50Gi
    storageClassName: "" # nonempty selects a dedicated PVC instead of managed NFS
    existingClaim: "" # pre-created, writable by UID/GID 1000 if set
  media:
    create: true
    existingClaim: media-data
    nfs: {}

serviceAccount:
  create: false
  name: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  ingressFrom: [openresty]
  # Public update center, plugin mirrors and public Git hosts use shared public egress.
  # Add only the namespaces needed for private in-cluster Git/proxy endpoints.
  egressTo: []
