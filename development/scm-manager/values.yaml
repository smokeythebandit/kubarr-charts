namespace:
  name: scm-manager

scm-manager:
  replicaCount: 1
  image:
    repository: scmmanager/scm-manager
    tag: "3.12.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
  # Kubarr forwards /scm-manager without stripping the prefix.
  basePath: /scm-manager
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Optional automated first boot: Secret key initialPassword is only used
  # when there is no admin account yet. Default uses a token in pod logs.
  bootstrap:
    existingSecret: ""
    passwordKey: initialPassword
    initialUser: scmadmin

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/var/lib/scm"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config"]

storage:
  mounts:
    - {name: home, source: development/scm-manager/scm-manager/home, target: /var/lib/scm, mode: read-write}
  migrationConfirmed: false
  home:
    existingClaim: ""
    storageClassName: "" # nonempty selects a dedicated PVC instead of managed NFS
    size: 20Gi
  media:
    create: true
    existingClaim: media-data
    nfs: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: ""
  annotations: {}
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  ingressFrom: [openresty]
  egressTo: []

vpa:
  enabled: false
  updateMode: Auto
