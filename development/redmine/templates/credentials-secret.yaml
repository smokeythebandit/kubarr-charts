{{- if and .Values.database.bundled.enabled (not .Values.secrets.existingSecret) -}}
{{- $name := include "redmine.credentialsSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name $name -}}
{{- if and .Release.IsUpgrade (not $existing) -}}
{{- fail (printf "Generated credentials Secret %s is missing on upgrade; restore it from backup before continuing" $name) -}}
{{- end -}}
{{- $claim := default (printf "data-%s-postgres-0" (include "redmine.fullname" .)) .Values.database.bundled.persistence.existingClaim -}}
{{- $oldClaim := lookup "v1" "PersistentVolumeClaim" .Values.namespace.name $claim -}}
{{- $emptyUnboundClaim := and $oldClaim (eq $oldClaim.status.phase "Pending") (not $oldClaim.spec.volumeName) -}}
{{- if and (not $existing) $oldClaim (not $emptyUnboundClaim) -}}
{{- fail (printf "Database claim %s already exists but generated Secret %s is missing; restore matching credentials or set secrets.existingSecret" $claim $name) -}}
{{- end -}}
{{- if and $existing (or (not (index $existing.data .Values.secrets.databasePasswordKey)) (not (index $existing.data .Values.secrets.sessionKey))) -}}
{{- fail (printf "Generated credentials Secret %s is missing a required key; restore it before continuing" $name) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.secrets.databasePasswordKey }}: {{ if $existing }}{{ index $existing.data .Values.secrets.databasePasswordKey | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{ .Values.secrets.sessionKey }}: {{ if $existing }}{{ index $existing.data .Values.secrets.sessionKey | quote }}{{ else }}{{ randAlphaNum 128 | b64enc | quote }}{{ end }}
{{- end }}
