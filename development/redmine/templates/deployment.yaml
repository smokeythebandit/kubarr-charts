apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redmine.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "redmine.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # no concurrent migrations or writers on attachments
  selector:
    matchLabels:
      {{- include "redmine.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redmine.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubarr-common.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if and (not .Values.storage.attachments.existingClaim) (not .Values.storage.attachments.storageClassName) .Values.storage.media.create (not .Values.storage.media.nfs.server) }}
        - name: prepare-files
          image: busybox:1.37.0
          command: [sh, -ec, 'mkdir -p -- "$1" && chown 999:999 -- "$1"', --, {{ printf "/nfs/%s" (include "redmine.filesSubPath" .) | quote }}]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN]}}
          volumeMounts:
            - {name: files, mountPath: /nfs}
        {{- end }}
        - name: wait-for-postgres
          image: "{{ .Values.database.bundled.image.repository }}:{{ .Values.database.bundled.image.tag }}"
          imagePullPolicy: {{ .Values.database.bundled.image.pullPolicy }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: PGHOST
              value: {{ include "redmine.dbHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.database.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
          command: [sh, -c, 'until pg_isready; do sleep 3; done']
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: redmine
          image: "{{ .Values.redmine.image.repository }}:{{ .Values.redmine.image.tag }}"
          imagePullPolicy: {{ .Values.redmine.image.pullPolicy }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: RAILS_RELATIVE_URL_ROOT
              value: /redmine
            - name: REDMINE_DB_POSTGRES
              value: {{ include "redmine.dbHost" . | quote }}
            - name: REDMINE_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: REDMINE_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: REDMINE_DB_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: REDMINE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redmine.credentialsSecret" . | quote }}
                  key: {{ .Values.secrets.databasePasswordKey | quote }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "redmine.credentialsSecret" . | quote }}
                  key: {{ .Values.secrets.sessionKey | quote }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /redmine/login, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.redmine.resources | nindent 12 }}
          volumeMounts:
            - name: rack-config
              mountPath: /usr/src/redmine/config.ru
              subPath: config.ru
              readOnly: true
            - name: files
              mountPath: /usr/src/redmine/files
              {{- if and (not .Values.storage.attachments.existingClaim) (not .Values.storage.attachments.storageClassName) }}
              subPath: {{ include "redmine.filesSubPath" . | quote }}
              {{- end }}
      volumes:
        - name: rack-config
          configMap:
            name: {{ include "redmine.fullname" . }}-rack
        - name: files
          persistentVolumeClaim:
            claimName: {{ if and (not .Values.storage.attachments.existingClaim) (not .Values.storage.attachments.storageClassName) }}{{ .Values.storage.media.existingClaim | quote }}{{ else }}{{ default (printf "%s-files" (include "redmine.fullname" .)) .Values.storage.attachments.existingClaim | quote }}{{ end }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
