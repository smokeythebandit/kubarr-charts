namespace:
  name: redmine

redmine:
  image:
    repository: docker.io/library/redmine
    tag: 7.0.2-bookworm
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  # The gateway forwards /redmine unchanged; config.ru mounts Rails at this prefix.
  basePath: /redmine
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

# Empty generates a retained Secret for bundled PostgreSQL and Rails sessions.
# External PostgreSQL requires an explicit existingSecret.
secrets:
  existingSecret: ""
  databasePasswordKey: database-password
  sessionKey: secret-key-base

database:
  host: "" # required if bundled.enabled=false
  port: 5432
  username: redmine
  name: redmine
  bundled:
    enabled: true
    image:
      repository: docker.io/library/postgres
      tag: 16.15-bookworm
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    persistence:
      existingClaim: ""
      size: 10Gi
      storageClassName: "" # empty uses the managed NFS share; nonempty uses dedicated PVC

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/usr/src/redmine/files"]
      postgres: ["/var/lib/postgresql/data"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config", "/usr/src/redmine/config.ru"]
      postgres: ["/dev/shm", "/config"]

storage:
  migrationConfirmed: false # set only after moving old local PVC data to NFS
  mounts:
    - {name: attachments, source: development/redmine/redmine/files, target: /usr/src/redmine/files, mode: read-write}
  workloads:
    postgres:
      mounts:
        - {name: database, source: development/redmine/redmine/postgres, target: /var/lib/postgresql/data, mode: read-write}
  attachments:
    existingClaim: ""
    size: 10Gi
    storageClassName: "" # empty uses managed NFS; nonempty uses dedicated PVC
  media:
    create: true
    existingClaim: media-data
    nfs: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  ingressFrom: [openresty]
  egressTo: [] # namespaces for external private PostgreSQL or SMTP
