{{- /* Generated once and kept: the Soulseek account is registered on the
network at first login, so a new username or password on every upgrade would
lock slskd out of the account it created. */ -}}
{{- if not .Values.secrets.existingSecret -}}
{{- $name := printf "%s-credentials" (include "slskd.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name $name -}}
{{- $keys := list .Values.secrets.usernameKey .Values.secrets.passwordKey .Values.secrets.apiKeyKey .Values.secrets.webPasswordKey -}}
{{- if $existing -}}
{{- range $keys -}}
{{- if not (index $existing.data .) -}}
{{- fail (printf "Generated Secret %s is missing key %s; restore it before continuing" $name .) -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "slskd.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{- range $keys }}
  {{ . }}: {{ index $existing.data . | quote }}
  {{- end }}
  {{- else }}
  {{ .Values.secrets.usernameKey }}: {{ printf "kubarr%s" (randAlphaNum 10 | lower) | b64enc | quote }}
  {{ .Values.secrets.passwordKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{ .Values.secrets.apiKeyKey }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{ .Values.secrets.webPasswordKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
