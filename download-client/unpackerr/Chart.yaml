apiVersion: v2
name: unpackerr
description: Extracts RAR, ZIP and 7z downloads so Sonarr, Radarr and Lidarr can import them
type: application
version: 1.0.1+4
appVersion: "1.0.1"
keywords:
  - unpackerr
  - extract
  - rar
  - download-client
home: https://unpackerr.zip
sources:
  - https://github.com/Unpackerr/unpackerr
maintainers:
  - name: Kubarr Team
# Kubarr annotations - used by the catalog service (services/catalog.rs) for app discovery.
annotations:
  kubarr.io/display-name: "Unpackerr"
  kubarr.io/icon: "📦"
  kubarr.io/category: "download-client"
  # The web UI shows the queue, history and logs. It runs without a login of its
  # own (noauth): only Kubarr's gateway may reach it, and the gateway requires a
  # Kubarr session with access to Unpackerr. It is an app a user chooses, not a
  # platform component.
  kubarr.io/system: "false"
  kubarr.io/browseable: "true"
dependencies:
  - name: kubarr-common
    version: 0.8.4
    repository: file://../../system/kubarr-common
