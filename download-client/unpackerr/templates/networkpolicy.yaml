{{- /* Not the shared helper: ingress exists only while the web UI is on, and
egress only reaches the Starr apps the link follows. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "unpackerr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "unpackerr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if and .Values.unpackerr.web.enabled .Values.networkPolicy.ingressFrom }}
  ingress:
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.unpackerr.service.targetPort }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if (default dict .Values.starrLink).enabled }}
    {{- range $app := list "sonarr" "radarr" "lidarr" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $app }}
      ports:
        - protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
