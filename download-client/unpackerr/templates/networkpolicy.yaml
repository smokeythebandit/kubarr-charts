{{- /* Not the shared helper: that one describes a server with a Service and an
ingress list. Unpackerr is neither called nor calls anything; it only works on
the shared download storage. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "unpackerr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "unpackerr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if (default dict .Values.starrLink).enabled }}
    {{- range $app := list "sonarr" "radarr" "lidarr" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $app }}
      ports:
        - protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
