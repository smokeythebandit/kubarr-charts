# Default values for sabnzbd
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace configuration
namespace:
  create: true
  name: sabnzbd

# SABnzbd application configuration
sabnzbd:
  replicaCount: 1

  image:
    repository: linuxserver/sabnzbd
    pullPolicy: IfNotPresent
    tag: "5.1.3"

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi

  # Environment variables
  env:
    # User ID to run SABnzbd as
    PUID: "1000"
    # Group ID to run SABnzbd as
    PGID: "1000"
    # Timezone
    TZ: "Etc/UTC"

  # SABnzbd serves at root; Kubarr strips /sabnzbd and rewrites root redirects.
  basePath: ""

  # Probes configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false  # linuxserver images run as root but switch to PUID/PGID
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: sabnzbd
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  # Name of the Kubernetes secret containing VPN credentials
  secretName: ""
  # Gluetun container image
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  # Resource limits for Gluetun container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kill switch - block all traffic if VPN disconnects
  killSwitch: true
  # Subnets to allow even when VPN is active (for cluster internal communication)
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""
  # Server picker: chooses the fastest VPN server before gluetun starts and
  # re-evaluates it while the pod runs. Reads fall back to these defaults.
  picker:
    enabled: true
    shortlist: 5
    sample: 40
    initBudget: 60s
    testSeconds: 8
    testEndpoints:
      - https://proof.ovh.net/files/100Mb.dat
      - http://speedtest.tele2.net/100MB.zip
    interval: 15m
    degradeThreshold: 0.4
    degradeChecks: 3
    cooldown: 6h
    switchWhileRunning: true
    image:
      repository: ghcr.io/smokeythebandit/kubarr-vpn-picker
      tag: main
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/downloads"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config", "/custom-services.d/setup-apikey", "/kubarr-secrets/sabnzbd"]

storage:
  mounts:
    - {name: downloads, source: downloads/sabnzbd, target: /downloads, mode: read-write}
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass
  media:
    existingClaim: media-data

# SABnzbd API key. Kubarr sets secretName to a Secret (key: api-key) holding the
# API key it also hands to Radarr/Sonarr/Lidarr, and this chart writes it into
# sabnzbd.ini so those services can authenticate. Empty leaves the key SABnzbd
# generated for itself in place; there is no default key.
sabnzbdIntegration:
  secretName: ""

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - sonarr         # arr apps connecting to download client
    - radarr
    - lidarr
    - victoriametrics  # metrics scraping
  egressTo: []       # download clients mainly need outbound internet
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
