apiVersion: v2
name: sabnzbd
description: Free and open-source Usenet binary newsreader with web interface
type: application
version: 5.1.1+2
appVersion: "5.1.1"
keywords:
  - sabnzbd
  - usenet
  - nzb
  - download
  - newsreader
  - media
home: https://sabnzbd.org/
sources:
  - https://github.com/sabnzbd/sabnzbd
maintainers:
