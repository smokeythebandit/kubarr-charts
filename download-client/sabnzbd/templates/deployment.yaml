apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sabnzbd.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sabnzbd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sabnzbd.replicaCount }}
  selector:
    matchLabels:
      {{- include "sabnzbd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sabnzbd.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sabnzbd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "kubarr-common.gluetun.initContainer" (dict "root" .)) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.sabnzbd.service.targetPort) | nindent 8 }}
        - name: sabnzbd
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.sabnzbd.image.repository }}:{{ .Values.sabnzbd.image.tag }}"
          imagePullPolicy: {{ .Values.sabnzbd.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.sabnzbd.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sabnzbd.fullname" . }}-config
          {{- if .Values.sabnzbd.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.sabnzbd.livenessProbe.httpGet.path }}
              port: {{ .Values.sabnzbd.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.sabnzbd.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sabnzbd.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.sabnzbd.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sabnzbd.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.sabnzbd.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.sabnzbd.readinessProbe.httpGet.path }}
              port: {{ .Values.sabnzbd.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.sabnzbd.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sabnzbd.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.sabnzbd.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sabnzbd.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.sabnzbd.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.mediaMount" (dict "root" . "mountPath" "/downloads" "subPath" .Values.storage.media.downloadsSubPath) | nindent 12 }}
            # Setup script for API key configuration
            - name: setup-script
              mountPath: /custom-services.d/setup-apikey
              subPath: setup-apikey.sh
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "sabnzbd.fullname" .)) | nindent 8 }}
        # Setup script configmap for API key configuration
        - name: setup-script
          configMap:
            name: {{ include "sabnzbd.fullname" . }}-setup
            defaultMode: 0755
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
