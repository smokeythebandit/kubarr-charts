apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qbittorrent.fullname" . }}-init
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
data:
  99-apply-config.sh: |
    #!/bin/bash
    # Seed missing defaults, then update only Kubarr-managed VPN settings.
    set -eu

    CONFIG_DIR="/config/qBittorrent"
    CONFIG_FILE="${CONFIG_DIR}/qBittorrent.conf"
    IMMUTABLE_CONFIG="/config-immutable/qBittorrent.conf"

    mkdir -p "$CONFIG_DIR"

    if [ ! -s "$CONFIG_FILE" ]; then
      echo "Seeding qBittorrent configuration..."
      cp "$IMMUTABLE_CONFIG" "$CONFIG_FILE"
      exit 0
    fi

    # LinuxServer creates a minimal config before custom-cont-init.d runs.
    # Merge defaults by INI section/key instead of treating any existing file
    # as fully initialized. Explicit user preferences always take precedence.
    awk '
      function emit_missing(group, i, entry) {
        for (i = 1; i <= count[group]; i++) {
          entry = group SUBSEP keys[group, i]
          if (!(entry in seen)) {
            print defaults[entry]
            seen[entry] = 1
          }
        }
      }
      FNR == 1 { section = "" }
      FILENAME == ARGV[1] {
        if ($0 ~ /^\[/) {
          section = $0
          groups[++group_count] = section
        } else if (index($0, "=") > 0) {
          key = substr($0, 1, index($0, "=") - 1)
          keys[section, ++count[section]] = key
          defaults[section, key] = $0
        }
        next
      }
      /^\[/ {
        emit_missing(section)
        section = $0
        present[section] = 1
      }
      {
        if (index($0, "=") > 0)
          seen[section, substr($0, 1, index($0, "=") - 1)] = 1
        print
      }
      END {
        emit_missing(section)
        for (g = 1; g <= group_count; g++) {
          section = groups[g]
          if (!(section in present)) {
            print ""
            print section
            emit_missing(section)
          }
        }
      }
    ' "$IMMUTABLE_CONFIG" "$CONFIG_FILE" > "${CONFIG_FILE}.tmp"
    mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"

    update_managed_setting() {
      key="$1"
      value=$(MANAGED_KEY="$key" awk -F= 'index($0, ENVIRON["MANAGED_KEY"] "=") == 1 { sub(/^[^=]*=/, ""); print; exit }' "$IMMUTABLE_CONFIG")
      [ -n "$value" ] || return 0

      MANAGED_KEY="$key" MANAGED_VALUE="$value" awk '
        index($0, ENVIRON["MANAGED_KEY"] "=") == 1 {
          print ENVIRON["MANAGED_KEY"] "=" ENVIRON["MANAGED_VALUE"]
          found=1
          next
        }
        { print }
        END { if (!found) exit 2 }
      ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" || {
        rm -f "${CONFIG_FILE}.tmp"
        return 0
      }
      mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
    }

    update_managed_setting 'Session\Port'
    update_managed_setting 'PortForwardingEnabled'
    update_managed_setting 'Connection\PortRangeMin'
    update_managed_setting 'Connection\UPnP'

    echo "Kubarr-managed VPN settings applied; WebUI preferences preserved."
