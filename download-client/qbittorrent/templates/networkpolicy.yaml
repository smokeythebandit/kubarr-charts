{{ include "kubarr-common.networkPolicy" (dict "root" . "app" .Values.qbittorrent) }}
{{- if and .Values.networkPolicy.enabled .Values.vpn.enabled }}
---
# The Gluetun control API is only needed by the Kubarr backend for forwarded-port queries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gluetun-control
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubarr-backend
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kubarr-backend
      ports:
        - protocol: TCP
          port: 8001
{{- end }}
