apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.qbittorrent.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/init: {{ include (print $.Template.BasePath "/configmap-init.yaml") . | sha256sum }}
        checksum/qbittorrent-conf: {{ include (print $.Template.BasePath "/configmap-qbittorrent.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "qbittorrent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qbittorrent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.vpn.enabled }}
      initContainers:
        - name: gluetun-tmp-permissions
          image: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag }}"
          imagePullPolicy: {{ .Values.vpn.image.pullPolicy }}
          command: ["/bin/sh", "-c", "chmod 0700 /tmp/gluetun"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
      {{- end }}
      containers:
        {{- if .Values.vpn.enabled }}
        # Gluetun VPN sidecar - routes all pod traffic through VPN
        - name: gluetun
          image: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag }}"
          imagePullPolicy: {{ .Values.vpn.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - CHOWN
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
          envFrom:
            - secretRef:
                name: {{ .Values.vpn.secretName }}
          env:
            {{- with .Values.vpn.firewallOutboundSubnets }}
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.vpn.killSwitch }}
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "{{ .Values.qbittorrent.service.targetPort }},{{ .Values.exporter.port }},9999,8001"
            {{- else }}
            - name: FIREWALL
              value: "off"
            {{- end }}
            # Bind healthcheck to all interfaces so Kubernetes probes work
            - name: HEALTH_SERVER_ADDRESS
              value: ":9999"
            # Move control server off port 8000 to avoid conflict with exporter
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8001"
            {{- if .Values.vpn.portForwarding.enabled }}
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
            {{- if .Values.vpn.portForwarding.upCommand }}
              value: {{ .Values.vpn.portForwarding.upCommand | quote }}
            {{- else }}
              # Gluetun substitutes {{ "{{PORT}}" }}; retry while qBittorrent's WebUI starts.
              value: {{ printf "/bin/sh -c 'i=0; until wget -q -T 5 -O /dev/null --post-data=\"json={\\\"listen_port\\\":{{PORT}}}\" http://127.0.0.1:%v/api/v2/app/setPreferences; do i=$((i+1)); [ \"$i\" -lt 30 ] || exit 1; sleep 2; done'" .Values.qbittorrent.service.targetPort | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: gluetun-http
              containerPort: 8888
              protocol: TCP
            - name: gluetun-ctrl
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.vpn.resources | nindent 12 }}
        {{- end }}
        - name: qbittorrent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.qbittorrent.image.repository }}:{{ .Values.qbittorrent.image.tag }}"
          imagePullPolicy: {{ .Values.qbittorrent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.qbittorrent.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "qbittorrent.fullname" . }}-config
          {{- if .Values.qbittorrent.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.qbittorrent.livenessProbe.httpGet.path }}
              port: {{ .Values.qbittorrent.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.qbittorrent.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.qbittorrent.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.qbittorrent.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.qbittorrent.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.qbittorrent.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.qbittorrent.readinessProbe.httpGet.path }}
              port: {{ .Values.qbittorrent.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.qbittorrent.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.qbittorrent.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.qbittorrent.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.qbittorrent.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.qbittorrent.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.mediaMount" (dict "root" . "mountPath" "/downloads" "subPath" .Values.storage.media.downloadsSubPath) | nindent 12 }}
            - name: init-scripts
              mountPath: /custom-cont-init.d
            - name: qbittorrent-conf
              mountPath: /config-immutable
              readOnly: true
        {{- if .Values.exporter.enabled }}
        # Metrics exporter sidecar
        - name: exporter
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          env:
            - name: QBITTORRENT_HOST
              value: "localhost"
            - name: QBITTORRENT_PORT
              value: "{{ .Values.qbittorrent.service.targetPort }}"
            - name: EXPORTER_PORT
              value: "{{ .Values.exporter.port }}"
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- if .Values.vpn.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: gluetun-tmp
          emptyDir: {}
        {{- end }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "qbittorrent.fullname" .)) | nindent 8 }}
        - name: init-scripts
          configMap:
            name: {{ include "qbittorrent.fullname" . }}-init
            defaultMode: 0755
        - name: qbittorrent-conf
          configMap:
            name: {{ include "qbittorrent.fullname" . }}-qbittorrent-conf
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
