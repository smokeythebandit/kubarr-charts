apiVersion: v2
name: deluge
description: Lightweight, cross-platform BitTorrent client with web interface
type: application
version: 2.2.0+2
appVersion: "2.2.0"
keywords:
  - deluge
  - bittorrent
  - download
  - torrent
  - media
home: https://deluge-torrent.org/
sources:
  - https://github.com/deluge-torrent/deluge
maintainers:
  - name: Kubarr Team
# Kubarr annotations - used by the catalog service (services/catalog.rs) for app discovery.
# display-name: human-readable name for the dashboard UI
# icon: emoji or identifier for the app catalog and sidebar
# category: groups apps in catalog (download-client, media-server, media-manager, etc.)
annotations:
  kubarr.io/display-name: "Deluge"
  kubarr.io/icon: "📥"
  kubarr.io/category: "download-client"
dependencies:
  - name: kubarr-common
    version: 0.3.2
    repository: file://../../system/kubarr-common
