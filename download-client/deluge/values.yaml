# Default values for deluge
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: deluge

# Deluge application configuration
deluge:
  replicaCount: 1

  image:
    repository: linuxserver/deluge
    pullPolicy: IfNotPresent
    tag: "2.2.0"

  # Base path for URL routing (leave empty for root)
  # Deluge does not support serving from a subpath
  basePath: ""

  # Service configuration
  service:
    type: ClusterIP
    port: 8112
    targetPort: 8112
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 8112
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 8112
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: deluge
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage configuration. All app storage is routed through the shared NFS claim.
storage:
  media:
    existingClaim: media-data
    mountPath: /data
    configMountPath: /config
    configSubPath: config/deluge
    downloadsMountPath: /downloads
    downloadsSubPath: downloads/deluge

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  secretName: ""
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  killSwitch: true
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    # Command to run when a new forwarded port is assigned ({{PORT}} is replaced by Gluetun)
    upCommand: 'deluge-console "config --set listen_ports ({{PORT}},{{PORT}})"'

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - sonarr
    - radarr
    - victoriametrics
  egressTo: []
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
