apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rutorrent.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "rutorrent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rutorrent.replicaCount }}
  selector:
    matchLabels:
      {{- include "rutorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rutorrent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rutorrent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepare-runtime-dirs
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /var/lib/nginx/logs /var/lib/nginx/tmp && chown -R 1000:1000 /var/lib/nginx && chmod -R 0777 /var/lib/nginx
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: nginx-state
              mountPath: /var/lib/nginx
        {{- include "kubarr-common.gluetun.initContainer" (dict "root" .) | nindent 8 }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.rutorrent.service.targetPort) | nindent 8 }}
        - name: rutorrent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.rutorrent.image.repository }}:{{ .Values.rutorrent.image.tag }}"
          imagePullPolicy: {{ .Values.rutorrent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.rutorrent.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rutorrent.fullname" . }}-config
          {{- if .Values.rutorrent.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.rutorrent.livenessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.rutorrent.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rutorrent.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rutorrent.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.rutorrent.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.rutorrent.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.rutorrent.readinessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.rutorrent.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rutorrent.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rutorrent.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.rutorrent.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.rutorrent.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.mediaMount" (dict "root" . "mountPath" "/downloads" "subPath" .Values.storage.media.downloadsSubPath) | nindent 12 }}
            - name: nginx-state
              mountPath: /var/lib/nginx
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "rutorrent.fullname" .)) | nindent 8 }}
        - name: nginx-state
          emptyDir: {}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
