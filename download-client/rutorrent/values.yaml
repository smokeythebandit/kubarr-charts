# Default values for rutorrent
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: rutorrent

# ruTorrent application configuration
rutorrent:
  replicaCount: 1

  image:
    repository: linuxserver/rutorrent
    pullPolicy: IfNotPresent
    tag: "v3.10-ls122"

  # Base path for URL routing (leave empty for root)
  # ruTorrent does not support serving from a subpath
  basePath: ""

  # Service configuration (linuxserver/rutorrent uses port 80)
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables (linuxserver/rutorrent)
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/downloads"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config", "/var/lib/nginx"]

storage:
  mounts:
    - {name: downloads, source: downloads/rutorrent, target: /downloads, mode: read-write}
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass
  media:
    existingClaim: media-data

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  secretName: ""
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  killSwitch: true
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""

# Security context
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: rutorrent
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - sonarr
    - radarr
    - lidarr
    - victoriametrics
  egressTo: []
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
