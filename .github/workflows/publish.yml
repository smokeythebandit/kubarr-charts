name: Publish

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Self-hosted mirror (zot on charts.kubarr.com). Anonymous pull; pushes use
  # the `ci` account from the KUBARR_CHARTS_REGISTRY_* secrets.
  MIRROR_REGISTRY: charts.kubarr.com
  MIRROR_REPO: oci://charts.kubarr.com/kubarr-charts

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Linting proves a chart renders; this proves it installs, reaches ready and
  # upgrades from what is already published. Four charts were published broken
  # on a green `validate`, so nothing is pushed until both gates pass.
  #
  # The gate selects every application chart whose version is not in the
  # registry yet -- the same lookup the push step below makes, so what is
  # gated is what is pushed. Selecting "changed since the previous commit"
  # let a CI-only commit push five charts an earlier failed publish had left
  # behind, none of them installed. Library charts and the charts the gate
  # skips by name (its job summary lists them) are pushed without an install.
  install-gate:
    needs: validate
    uses: ./.github/workflows/install-gate.yml
    permissions:
      contents: read
    with:
      charts: unpublished

  charts:
    needs: [validate, install-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute OCI repo
        id: vars
        run: echo "oci_repo=oci://${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: validated-charts
          path: ${{ runner.temp }}/helm-packages

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push validated charts
        run: |
          set -euo pipefail

          OCI_REPO="${{ steps.vars.outputs.oci_repo }}"
          echo "## Helm Charts Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          shopt -s failglob
          for pkg in "$RUNNER_TEMP/helm-packages/"*.tgz; do
            metadata=$(helm show chart "$pkg")
            # Anchored to column 0: `helm show chart` prints the chart's
            # dependencies too, and `$1 == "version:"` matched their indented
            # lines as well. cert-manager lists its dependency before its own
            # version, so the check resolved the dependency's v1.21.3, found
            # the older 1.21.3 in the registry and skipped the push -- leaving
            # chart sync pulling a version that was never published. App
            # charts escaped it only because their dependency block sits after
            # `version:`, which made the value two lines and the check error.
            chart_name=$(awk '/^name:/ {print $2; exit}' <<< "$metadata")
            version=$(awk '/^version:/ {print $2; exit}' <<< "$metadata")
            if [ -z "$chart_name" ] || [ -z "$version" ]; then
              echo "::error::could not read name/version from $pkg"
              exit 1
            fi
            # The install gate selected exactly the versions this finds
            # missing, so everything pushed here was installed and upgraded.
            if helm show chart "$OCI_REPO/$chart_name" --version "$version" >/dev/null 2>&1; then
              echo "Skipping $chart_name:$version (already published)"
              echo "- \`${chart_name}:${version}\` already exists" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "Pushing $chart_name..."
            helm push "$pkg" "$OCI_REPO"

            echo "- \`${chart_name}:${version}\` → \`${OCI_REPO}/${chart_name}\`" >> "$GITHUB_STEP_SUMMARY"

          done

      # GHCR is pushed first and stays the source of truth; the mirror catches
      # up independently (it checks its own contents), so a mirror outage
      # never blocks GHCR and a later run fills whatever an outage missed.
      - name: Log in to charts.kubarr.com
        env:
          MIRROR_USERNAME: ${{ secrets.KUBARR_CHARTS_REGISTRY_USERNAME }}
          MIRROR_PASSWORD: ${{ secrets.KUBARR_CHARTS_REGISTRY_PASSWORD }}
        run: echo "$MIRROR_PASSWORD" | helm registry login "$MIRROR_REGISTRY" --username "$MIRROR_USERNAME" --password-stdin

      - name: Push validated charts to charts.kubarr.com
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Mirrored to charts.kubarr.com" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          shopt -s failglob
          for pkg in "$RUNNER_TEMP/helm-packages/"*.tgz; do
            metadata=$(helm show chart "$pkg")
            chart_name=$(awk '/^name:/ {print $2; exit}' <<< "$metadata")
            version=$(awk '/^version:/ {print $2; exit}' <<< "$metadata")
            if helm show chart "$MIRROR_REPO/$chart_name" --version "$version" >/dev/null 2>&1; then
              echo "Mirror already has $chart_name:$version"
              continue
            fi
            echo "Mirroring $chart_name:$version..."
            helm push "$pkg" "$MIRROR_REPO"
            echo "- \`${chart_name}:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Logout
        if: always()
        run: |
          helm registry logout ${{ env.REGISTRY }} || true
          helm registry logout "$MIRROR_REGISTRY" || true
