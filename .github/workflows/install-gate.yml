name: Install gate

# Rendering tests cannot see a claim nothing binds, a tag that was never
# published, a pod its own namespace refuses to admit, or an upgrade that
# breaks where the install works. All four shipped on the same day with the
# suite green, so every chart that changes is installed, asserted ready and
# upgraded from its newest published revision in a real kind cluster before
# publish.yml is allowed to push anything. publish.yml selects 'unpublished':
# every chart whose version is not in the registry yet, which is what it pushes.

on:
  workflow_call:
    inputs:
      charts:
        description: "'changed', 'unpublished', 'all', or a comma-separated list of chart names"
        type: string
        default: changed
      base:
        description: Git ref or SHA that 'changed' compares against
        type: string
        default: origin/main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      charts:
        description: "'changed', 'unpublished', 'all', or a comma-separated list of chart names"
        type: string
        default: all
      base:
        description: Git ref or SHA that 'changed' compares against
        type: string
        default: origin/main
  schedule:
    # Nightly, after the daily dependency bumps have had time to land.
    - cron: "40 3 * * *"

permissions:
  contents: read

concurrency:
  group: install-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      charts_by_shard: ${{ steps.plan.outputs.charts_by_shard }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # 'changed' needs history on both sides of the comparison.
          fetch-depth: 0

      - name: Choose the targets
        id: targets
        env:
          # A pull request compares against main. A push to main compares
          # against the commit it is replacing, because against origin/main it
          # would compare HEAD with itself and install nothing. Schedules and
          # manual runs cover everything.
          EVENT: ${{ github.event_name }}
          INPUT_CHARTS: ${{ inputs.charts }}
          INPUT_BASE: ${{ inputs.base }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          charts="${INPUT_CHARTS:-}"
          base="${INPUT_BASE:-}"
          case "$EVENT" in
            schedule) charts="${charts:-all}" ;;
            pull_request) charts="${charts:-changed}"; base="${base:-origin/main}" ;;
          esac
          charts="${charts:-changed}"
          base="${base:-origin/main}"
          if [ "$base" = "origin/main" ]; then
            git fetch --no-tags origin main
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$base" = "$PUSH_BEFORE" ]; then
            # The replaced commit can be outside a shallow fetch on a force push.
            git fetch --no-tags origin "$PUSH_BEFORE" || base="origin/main"
          fi
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Selecting '$charts' against '$base'" >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v4.3.0

      - name: Add upstream chart repositories
        # Wrapper charts depend on upstream charts by repository URL, and
        # `helm dependency build` refuses a URL it has no repository entry for.
        run: |
          set -euo pipefail
          helm repo add jetstack https://charts.jetstack.io
          helm repo add cnpg https://cloudnative-pg.github.io/charts

      - name: Install harness dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gate"
          "$RUNNER_TEMP/gate/bin/python" -m pip install --quiet PyYAML==6.0.3

      - name: Plan the shards
        id: plan
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gate/bin/python" -u tests/e2e/install_gate.py \
            --charts "${{ steps.targets.outputs.charts }}" \
            --base "${{ steps.targets.outputs.base }}" \
            --plan-shards "$RUNNER_TEMP/plan.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          shards = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))["shards"]
          print("matrix=" + json.dumps(list(range(len(shards)))))
          print("charts_by_shard=" + json.dumps(shards))
          print("count=" + str(len(shards)))
          PY

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: install-gate-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 7

  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # A chart gets a 10 minute budget each for install and upgrade; a shard
    # holds a handful of them.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v4.3.0

      - name: Add upstream chart repositories
        # Wrapper charts depend on upstream charts by repository URL, and
        # `helm dependency build` refuses a URL it has no repository entry for.
        run: |
          set -euo pipefail
          helm repo add jetstack https://charts.jetstack.io
          helm repo add cnpg https://cloudnative-pg.github.io/charts

      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          # Matches the kind node image the harness pins.
          KUBECTL_VERSION: v1.35.8
          KUBECTL_SHA256: 874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          curl -fsSLo /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client=true

      - name: Enable the host NFS server
        # The shared media export is a privileged nfs-server-alpine container
        # using the runner's own kernel, as the installer acceptance run does.
        run: |
          set -euo pipefail
          sudo modprobe nfs
          sudo modprobe nfsd
          grep -E '^nodev[[:space:]]+(nfs|nfsd)$' /proc/filesystems

      - name: Log in to Docker Hub
        # Parallel shards share one runner IP range; an authenticated pull
        # avoids the anonymous rate limit. Skipped when no secret is provided.
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Install harness dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gate"
          "$RUNNER_TEMP/gate/bin/python" -m pip install --quiet PyYAML==6.0.3

      - name: Install, assert ready and upgrade this shard's charts
        env:
          SHARD_CHARTS: ${{ join(fromJSON(needs.plan.outputs.charts_by_shard)[matrix.shard], ',') }}
        run: |
          "$RUNNER_TEMP/gate/bin/python" -u tests/e2e/install_gate.py \
            --charts "$SHARD_CHARTS" \
            --artifacts "$RUNNER_TEMP/gate-artifacts"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: install-gate-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/gate-artifacts
          if-no-files-found: ignore
          retention-days: 7

  install:
    # The one status the gate reports: branch protection and publish.yml read it.
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/in
          pattern: install-gate-*
          merge-multiple: false

      - name: Merge the shard results
        run: |
          set -euo pipefail
          mapfile -t results < <(find "$RUNNER_TEMP/in" -path '*install-gate-shard-*' -name results.json | sort)
          python3 tests/e2e/merge_gate_results.py \
            --planned "$RUNNER_TEMP/in/install-gate-plan/plan.json" "${results[@]}"
