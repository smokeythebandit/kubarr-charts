name: Validate

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v4.3.0
      - run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm-packages"
          helm repo add jetstack https://charts.jetstack.io

          while IFS= read -r chart_yaml; do
            chart=$(dirname "$chart_yaml")
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              chart_type=$(helm show chart "$chart" | awk '/^type:/ { print $2 }')
              if [ "$chart_type" = application ]; then
                chart_version=$(helm show chart "$chart" | awk '/^version:/ { print $2 }')
                app_version=$(helm show chart "$chart" | awk '/^appVersion:/ { print $2 }')
                if [ -z "$app_version" ]; then
                  echo "::error file=$chart_yaml::application charts must declare appVersion"
                  exit 1
                fi

                chart_core=${chart_version%%+*}
                app_version=${app_version#\"}
                app_version=${app_version%\"}
                app_core=${app_version#v}
                app_core=${app_core%%+*}
                IFS=. read -r major minor patch _ <<EOF
          $app_core
          EOF
                normalized_app_version="$major.${minor:-0}.${patch:-0}"
                if [ "$chart_core" != "$normalized_app_version" ]; then
                  echo "::error file=$chart_yaml::chart version $chart_version does not match appVersion $app_version"
                  exit 1
                fi
              fi
              if grep -q '^dependencies:' "$chart/Chart.yaml"; then
                helm dependency build "$chart"
              fi
              helm lint "$chart"
              helm package "$chart" --destination "$RUNNER_TEMP/helm-packages"
            fi
          done < <(find . -mindepth 2 -name Chart.yaml | sort)

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit python3-venv
          python3 -m venv "$RUNNER_TEMP/chart-tests"
          "$RUNNER_TEMP/chart-tests/bin/python" -m pip install PyYAML==6.0.3

      - name: Packaged chart regression tests
        env:
          CHART_PACKAGES_DIR: ${{ runner.temp }}/helm-packages
        run: |
          "$RUNNER_TEMP/chart-tests/bin/python" -B -m unittest discover -s tests -v

      - name: Upload validated packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-charts
          path: ${{ runner.temp }}/helm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
