# Default values for plex
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  name: plex

# Plex application configuration
plex:
  replicaCount: 1

  image:
    repository: linuxserver/plex
    pullPolicy: IfNotPresent
    tag: "1.43.3"

  # Service configuration
  service:
    type: ClusterIP
    port: 32400
    targetPort: 32400
    annotations:
      kubarr.io/landing-path: "/web/"

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"
    VERSION: "docker"

  # Plex claim token (optional - for initial setup)
  # Get from https://plex.tv/claim
  claimToken: ""

  # Base path for reverse proxy (leave empty for root)
  # Plex serves its web UI at /web/ from root, not from a subpath
  basePath: ""

  # Probes configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /identity
      port: 32400
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /identity
      port: 32400
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Opt-in hardware transcoding; requires a device plugin advertising the selected
# resource on the node. No host device mounts or privileged access are added.
gpu:
  enabled: false
  provider: intel  # intel, nvidia, or amd
  # Empty uses gpu.intel.com/i915 (intel) or nvidia.com/gpu (nvidia).
  # Set gpu.intel.com/xe for Xe, nvidia.com/gpu.shared for NVIDIA time-slicing,
  # or the resource advertised by your prepared shared DRM plugin for AMD.
  resourceName: ""
  runtimeClassName: ""  # Optional, e.g. nvidia; omit if the device plugin needs none
  supplementalGroups: []  # Optional numeric render/video device group IDs

# Service Account
serviceAccount:
  create: true
  name: plex
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage configuration. All app storage is routed through the shared NFS claim.
storage:
  media:
    existingClaim: media-data
    mountPath: /data
    configMountPath: /config
    configSubPath: config/plex
    transcodeMountPath: /transcode
    transcodeSubPath: transcode/plex
    dataSubPath: media
  readOnly: true  # Plex only reads media

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  secretName: ""
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  killSwitch: true
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
  egressTo: []
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
