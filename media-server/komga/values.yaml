# Default values for komga
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: komga

# Komga application configuration
komga:
  replicaCount: 1

  image:
    repository: gotson/komga
    pullPolicy: IfNotPresent
    tag: "1.29.2"

  # Service configuration
  service:
    type: ClusterIP
    port: 25600
    targetPort: 25600
    annotations: {}

  # Resource limits and requests
  # Komga runs on the JVM; the heap grows with library size and with the
  # thumbnail generation that follows a scan.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Environment variables. SERVER_PORT and SERVER_SERVLET_CONTEXTPATH are
  # derived from the values below, not set here.
  env:
    TZ: "Etc/UTC"
    # The image default. Komga keeps database.sqlite, tasks.sqlite,
    # sessions.sqlite, the Lucene index and its logs here, so this is the
    # private claim, not the shared export: upstream refuses to support SQLite
    # on NFS or CIFS.
    KOMGA_CONFIGDIR: "/config"

  # Base path for reverse proxy (e.g., /komga)
  # Komga is a Spring Boot application and serves the API and web UI from its
  # servlet context path, actuator endpoints included.
  basePath: "/komga"

  # Probes configuration
  # Komga permits unauthenticated access to the actuator health endpoint only;
  # every other actuator endpoint requires the ADMIN role. The path follows the
  # context path, so it moves with basePath.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: komga
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      # The three SQLite databases, the Lucene index and the generated
      # thumbnails all live in the private claim.
      main: ["/config"]

storage:
  mounts:
    # Komga reads the library and stores everything it derives (thumbnails,
    # read progress, search index) in its own database. Writing metadata back
    # into the book files is an opt-in per-library setting that is off by
    # default, so both mounts stay read-only.
    - {name: comics, source: media/comics, target: /comics, mode: read}
    - {name: books, source: media/books, target: /books, mode: read}
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    # Three SQLite databases, the Lucene index and the generated thumbnails.
    size: 10Gi
    storageClassName: "" # empty: cluster default StorageClass (not managed NFS)
  media:
    existingClaim: media-data

# Network policy configuration
# Komga ships no Prometheus registry -- its actuator exposes only the simple
# in-memory meter registry -- so nothing scrapes it and victoriametrics is not
# an ingress source here.
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
  egressTo: []

# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
