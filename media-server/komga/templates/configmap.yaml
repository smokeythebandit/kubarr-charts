apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "komga.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "komga.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.komga.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Derived settings. Spring Boot's relaxed binding maps these environment
  # variable names onto server.port and server.servlet.context-path.
  SERVER_PORT: {{ .Values.komga.service.targetPort | quote }}
  SERVER_SERVLET_CONTEXTPATH: {{ default "/" .Values.komga.basePath | quote }}
