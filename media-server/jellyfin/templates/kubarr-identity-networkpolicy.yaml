{{- /* Policies add up: while sign-in with Kubarr is on, the plugin may call
Kubarr's API (password checks, user list) and Kubarr may push user changes to
Jellyfin. */ -}}
{{- if and .Values.networkPolicy.enabled (include "jellyfin.kubarrSso" .) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-kubarr-identity
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubarr-backend
      ports:
        - protocol: TCP
          port: {{ .Values.jellyfin.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubarr-backend
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
