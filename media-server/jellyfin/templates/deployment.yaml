{{- $writableMounts := list -}}
{{- range .Values.storage.mounts -}}
{{- if eq .mode "read-write" -}}{{- $writableMounts = append $writableMounts . -}}{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellyfin.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jellyfin.replicaCount }}
  {{- if or (default (dict) .Values.gpu).enabled .Values.storage.config.create }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jellyfin.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "kubarr-common.gpu.podSettings" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jellyfin.serviceAccountName" . }}
      securityContext:
        {{- include "kubarr-common.gpu.podSecurityContext" . | nindent 8 }}
      {{- if or .Values.vpn.enabled $writableMounts }}
      initContainers:
        {{- include "kubarr-common.gluetun.initContainer" (dict "root" .) | nindent 8 }}
        {{- if $writableMounts }}
        # Kubelet cannot mkdir subPaths as root on a root-squashed NFS export.
        # Prepare only writable app directories using the application's identity.
        - name: prepare-media-directories
          image: busybox:1.37.0
          command: [sh, -ec, 'umask 0002; for directory do mkdir -p -- "$directory"; test -w "$directory"; done', --]
          args:
            {{- range $writableMounts }}
            - {{ printf "/nfs/%s" .source | quote }}
            {{- end }}
          securityContext:
            runAsUser: {{ .Values.jellyfin.env.PUID | int }}
            runAsGroup: {{ .Values.jellyfin.env.PGID | int }}
            runAsNonRoot: {{ ne (int .Values.jellyfin.env.PUID) 0 }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /nfs
        {{- end }}
      {{- end }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.jellyfin.service.targetPort) | nindent 8 }}
        - name: jellyfin
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.jellyfin.image.repository }}:{{ .Values.jellyfin.image.tag }}"
          imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jellyfin.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "jellyfin.fullname" . }}-config
          {{- include "kubarr-common.gpu.env" . | nindent 10 }}
          {{- if .Values.jellyfin.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.jellyfin.livenessProbe.httpGet.path }}
              port: {{ .Values.jellyfin.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.jellyfin.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jellyfin.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jellyfin.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jellyfin.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.jellyfin.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.jellyfin.readinessProbe.httpGet.path }}
              port: {{ .Values.jellyfin.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.jellyfin.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jellyfin.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jellyfin.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jellyfin.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- include "kubarr-common.gpu.resources" (dict "root" . "resources" .Values.jellyfin.resources) | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.appMounts" (dict "root" .) | nindent 12 }}
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "jellyfin.fullname" .)) | nindent 8 }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
