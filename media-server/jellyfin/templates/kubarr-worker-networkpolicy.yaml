{{- /* Policies add up: while Jellyfin Enhanced is installed and Kubarr holds
Jellyfin's key, Kubarr's worker may call Jellyfin's API to fill in the
plugin's Seerr, Sonarr and Radarr settings. */ -}}
{{- if and .Values.networkPolicy.enabled (default dict .Values.jellyfinEnhanced).enabled (default dict .Values.jellyfinIntegration).secretName }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-kubarr-worker
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubarr-worker
      ports:
        - protocol: TCP
          port: {{ .Values.jellyfin.service.targetPort }}
{{- end }}
