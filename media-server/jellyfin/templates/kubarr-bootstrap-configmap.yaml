{{- if (default dict .Values.kubarrPlugin).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jellyfin.fullname" . }}-kubarr-bootstrap
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
data:
  bootstrap.json: |
    {{- dict
      "server_name" .Values.kubarrPlugin.server.name
      "ui_culture" .Values.kubarrPlugin.server.uiCulture
      "metadata_language" .Values.kubarrPlugin.server.metadataLanguage
      "metadata_country" .Values.kubarrPlugin.server.metadataCountry
      "libraries" .Values.kubarrPlugin.libraries
      | toPrettyJson | nindent 4 }}
{{- end }}
