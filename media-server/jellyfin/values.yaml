# Default values for jellyfin
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  name: jellyfin

# Jellyfin application configuration
jellyfin:
  replicaCount: 1

  image:
    repository: ghcr.io/linuxserver/jellyfin
    pullPolicy: IfNotPresent
    tag: "12.3ubu2604-ls56"

  # Service configuration
  service:
    type: ClusterIP
    port: 8096
    targetPort: 8096
    # kubarr.io/landing-path is added by the template while sign-in with
    # Kubarr is on, so opening Jellyfin from Kubarr signs the user in.
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Base path for reverse proxy (leave empty for root)
  # Jellyfin serves at root; it redirects / to /web/ internally
  basePath: ""

  # Probes configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8096
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Opt-in hardware transcoding; requires a device plugin advertising the selected
# resource on the node. No host device mounts or privileged access are added.
gpu:
  enabled: false
  provider: intel  # intel, nvidia, or amd
  # Empty uses gpu.intel.com/i915 (intel) or nvidia.com/gpu (nvidia).
  # Set gpu.intel.com/xe for Xe, nvidia.com/gpu.shared for NVIDIA time-slicing,
  # or the resource advertised by your prepared shared DRM plugin for AMD.
  resourceName: ""
  runtimeClassName: ""  # Optional, e.g. nvidia; omit if the device plugin needs none
  supplementalGroups: []  # Optional numeric render/video device group IDs

# Service Account
serviceAccount:
  create: true
  name: jellyfin
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      # The node-local transcoding scratch volume is not listed: the
      # validator reserves storage.scratch.target on its own, so dropping
      # storage.scratch frees that path for a shared mount.
      main: ["/config", "/kubarr-secrets/jellyfin", "/kubarr-secrets/jellyfin-identity", "/kubarr-config"]

storage:
  mounts:
    - {name: library, source: media, target: /media, mode: read}
  # Transcoding scratch. Jellyfin writes HLS segments here at the full output
  # bitrate and regenerates anything it loses, so this belongs on the node, not
  # the shared export: a 4K session can write over 100 GB, and on NFS every
  # segment crosses the network three times (written, read back, delivered).
  # sizeLimit is mandatory -- an overrun evicts this pod instead of filling the
  # node. Keep it well under the node's free space, and enable Jellyfin's own
  # transcode throttling and segment deletion so a session stays bounded.
  # On a node too small for a local cache, set backend: nfs with a source
  # (e.g. cache/jellyfin) and sizeLimit: null -- Helm merges values, so the
  # default cap survives an override that only omits it.
  scratch:
    backend: node
    target: /cache
    sizeLimit: 24Gi
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass
  media:
    existingClaim: media-data

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  secretName: ""
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  killSwitch: true
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""
  # Server picker: chooses the fastest VPN server before gluetun starts and
  # re-evaluates it while the pod runs. Reads fall back to these defaults.
  picker:
    enabled: true
    shortlist: 5
    sample: 40
    initBudget: 60s
    testSeconds: 8
    testEndpoints:
      - https://proof.ovh.net/files/100Mb.dat
      - http://speedtest.tele2.net/100MB.zip
    interval: 15m
    degradeThreshold: 0.4
    degradeChecks: 3
    cooldown: 6h
    switchWhileRunning: true
    image:
      repository: ghcr.io/smokeythebandit/kubarr-vpn-picker
      tag: 26e9358
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - jellyseerr
  # Jellyfin Enhanced calls Seerr, Sonarr and Radarr from the server side.
  egressTo:
    - jellyseerr
    - sonarr
    - radarr
    - dispatcharr  # Live TV tuner, guide and streams

# API key shared with Sonarr and Radarr so their imports refresh the library.
# Kubarr sets secretName to a Secret (key: api-key) it also gives those apps;
# the Kubarr plugin (or, with the plugin off, a sidecar) keeps the key
# registered in Jellyfin, and Sonarr and Radarr may then reach Jellyfin on its
# HTTP port. Empty disables all of it.
jellyfinIntegration:
  secretName: ""

# Key the Kubarr plugin and Kubarr use to call each other: the plugin checks
# native-app passwords and reads Kubarr's user list, Kubarr pushes user
# changes. Kubarr sets secretName; empty leaves sign-in with Kubarr off.
kubarrIdentity:
  secretName: ""

# The Kubarr plugin (github.com/smokeythebandit/kubarr-jellyfin): sign in with
# Jellyfin Enhanced (github.com/n00bcodr/Jellyfin-Enhanced, GPL-3.0): keyboard
# shortcuts, subtitle styling, Seerr requests, and a Sonarr/Radarr calendar and
# downloads view. An init container downloads this exact release, checks its
# sha256 and unpacks it into the plugin folder; a failure only skips it. Kubarr
# fills in its Seerr, Sonarr and Radarr settings; edits made in its own
# settings page are kept. Updating means changing version and sha256 together.
jellyfinEnhanced:
  enabled: true
  version: "12.15.0.0"
  # Jellyfin ABI the release zip targets; picks the zip and goes in meta.json.
  targetAbi: "12.0.0.0"
  sha256: 19c8b691557be4b342562069e610756e294bd4648eefe1f25504c3014d90e2fb
  # Override for a mirror; defaults to the GitHub release asset.
  url: ""

# Companion plugins Jellyfin Enhanced lists under Overview > Optional
# Dependencies. An init container downloads each enabled one, checks its sha256
# and unpacks it into the plugin folder; a failure only skips that plugin.
# Builds must match this chart's Jellyfin ABI. KefinTweaks is not here: it is
# a web script loaded through JavaScript Injector, not a server plugin.
jellyfinPlugins:
  enabled: true
  plugins:
    # Lets plugins edit served web files in memory; Plugin Pages and Custom
    # Tabs need it.
    - name: File Transformation
      enabled: true
      guid: 5e87cc92-571a-4d8d-8d98-d2d4147f9f90
      version: "3.0.3.0"
      targetAbi: "12.0.0.0"
      assembly: Jellyfin.Plugin.FileTransformation.dll
      url: https://github.com/IAmParadox27/jellyfin-plugin-file-transformation/releases/download/3.0.3.0/Release-12.0.0.zip
      sha256: e4a4c777aba618185b2f1107010c5e19bb4504de1257dbc791c700a05a3e96c8
      description: Lets other plugins transform the web client's files in memory.
    # Sidebar pages for Jellyfin Enhanced's "Use Plugin Pages" options.
    - name: Plugin Pages
      enabled: true
      guid: 5b6550fa-a014-4f4c-8a2c-59a43680ac6d
      version: "3.0.3.0"
      targetAbi: "12.0.0.0"
      assembly: Jellyfin.Plugin.PluginPages.dll
      url: https://github.com/IAmParadox27/jellyfin-plugin-pages/releases/download/3.0.3.0/Release-12.0.0.zip
      sha256: d707add3896c75ee6f4dca883f01c33cb9590d51457a2148d4b9ff70adbc5c13
      description: Adds plugin-provided pages to the web client.
    # Home tabs for Jellyfin Enhanced's "Use Custom Tabs" options.
    - name: Custom Tabs
      enabled: true
      guid: fbacd0b6-fd46-4a05-b0a4-2045d6a135b0
      version: "0.3.3.0"
      targetAbi: "12.0.0.0"
      assembly: Jellyfin.Plugin.CustomTabs.dll
      url: https://github.com/IAmParadox27/jellyfin-plugin-custom-tabs/releases/download/0.3.3.0/Release-12.0.0.zip
      sha256: ed3efeff440ba1a055aa4e65127493bd82fedbfc5bb8293ed8a019648064d138
      description: Adds custom tabs to the home screen.
    # Detects intros and credits for Jellyfin Enhanced's Auto-Skip. Its
    # analysis runs as a scheduled task and uses CPU while it scans.
    - name: Intro Skipper
      enabled: true
      guid: c83d86bb-a1e0-4c35-a113-e2101cf4ee6b
      version: "12.0.6.0"
      targetAbi: "12.2.0.0"
      assembly: IntroSkipper.dll
      url: https://github.com/intro-skipper/intro-skipper/releases/download/12.0/v12.0.6.0/intro-skipper-v12.0.6.0.zip
      sha256: 28cb2b92ed51f0e6029c46295cd201be02fd50cba98d18f14defe6d52aa36352
      description: Detects intro and credit segments.
    # Episode list inside the player, for the Open Episode Preview shortcut.
    - name: InPlayerEpisodePreview
      enabled: true
      guid: 73833d5f-0bcb-45dc-ab8b-7ce668f4345d
      version: "2.5.0.3"
      targetAbi: "12.0.0.0"
      assembly: Namo.Plugin.InPlayerEpisodePreview.dll
      url: https://github.com/Namo2/InPlayerEpisodePreview/releases/download/v2.5.0/InPlayerEpisodePreview_2.5.0.3-12.0.zip
      sha256: fa33b34ccf430f76baa6ca23412318de09b990df605c9dd7f40d98a92c421c89
      description: Shows the episode list inside the video player.

# Kubarr accounts, and server setup in place of the startup wizard. An init
# container copies it into Jellyfin's plugin folder on every start.
kubarrPlugin:
  enabled: true
  image:
    repository: ghcr.io/smokeythebandit/kubarr-jellyfin
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  # Kubarr's API inside the cluster.
  apiUrl: http://kubarr-backend.kubarr-backend.svc.cluster.local:8000
  # Applied once in place of the startup wizard.
  server:
    name: Kubarr
    uiCulture: en-US
    metadataLanguage: en
    metadataCountry: US
  # Created once each if the folder exists; a library you delete stays
  # deleted. Paths are inside the pod (storage.mounts puts media at /media).
  libraries:
    - {name: Movies, type: movies, paths: [/media/movies]}
    - {name: Shows, type: tvshows, paths: [/media/shows]}
    - {name: Music, type: music, paths: [/media/music]}

# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
