apiVersion: v2
name: jellyfin
description: Free software media server for organizing and streaming media
type: application
version: 12.3.0+21
appVersion: "12.3"
# Kubarr annotations - used by the catalog service (services/catalog.rs) for app discovery.
# display-name: human-readable name for the dashboard UI
# icon: emoji or identifier for the app catalog and sidebar
# category: groups apps in catalog (download-client, media-server, media-manager, etc.)
annotations:
  kubarr.io/display-name: "Jellyfin"
  kubarr.io/icon: "📺"
  kubarr.io/category: "media-server"
  # The Kubarr plugin signs gateway users in from a signed identity header,
  # and native clients (TV, phone) cannot send Kubarr's cookie, so Jellyfin
  # authenticates its own requests with Kubarr-backed accounts.
  kubarr.io/identity-header: "true"
  kubarr.io/gateway-auth: "app-native"
dependencies:
  - name: kubarr-common
    version: 0.8.4
    repository: file://../../system/kubarr-common
