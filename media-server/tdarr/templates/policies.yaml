{{ include "kubarr-common.networkPolicy" (dict "root" . "app" .Values.tdarr) }}
{{- if and .Values.networkPolicy.enabled .Values.node.enabled (gt (int .Values.node.replicaCount) 0) }}
---
# Node pods dial the server's own port inside this namespace. The shared policy
# above covers DNS and the gateway, and leaves every private address denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tdarr.fullname" . }}-nodes
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tdarr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tdarr.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tdarr.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tdarr.service.serverPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "tdarr.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tdarr.service.serverPort }}
{{- end }}
