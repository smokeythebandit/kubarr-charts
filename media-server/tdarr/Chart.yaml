apiVersion: v2
name: tdarr
description: Distributed transcoding and health checking for media libraries
type: application
# Upstream publishes zero-padded tags (3.04.00); appVersion carries the same
# release normalized to major.minor.patch so the chart version stays SemVer2.
version: 3.4.0+4
appVersion: "3.4.0"
# Kubarr annotations - used by the catalog service (services/catalog.rs) for app discovery.
# display-name: human-readable name for the dashboard UI
# icon: emoji or identifier for the app catalog and sidebar
# category: groups apps in catalog (download-client, media-server, media-manager, etc.)
annotations:
  kubarr.io/display-name: "Tdarr"
  kubarr.io/icon: "🎬"
  kubarr.io/category: "media-server"
dependencies:
  - name: kubarr-common
    version: 0.7.0
    repository: file://../../system/kubarr-common
