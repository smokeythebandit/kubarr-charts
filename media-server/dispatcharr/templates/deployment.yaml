apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dispatcharr.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "dispatcharr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dispatcharr.replicaCount }}
  # One pod owns the embedded PostgreSQL data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dispatcharr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/tuner: {{ include (print $.Template.BasePath "/tuner-configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dispatcharr.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "kubarr-common.gpu.podSettings" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dispatcharr.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "kubarr-common.gpu.podSecurityContext" . | nindent 8 }}
      {{- with include "kubarr-common.gluetun.initContainer" (dict "root" .) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.dispatcharr.service.targetPort "inputPorts" (toString .Values.dispatcharr.tuner.port)) | nindent 8 }}
        - name: dispatcharr
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.dispatcharr.image.repository }}:{{ .Values.dispatcharr.image.tag }}"
          imagePullPolicy: {{ .Values.dispatcharr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dispatcharr.service.targetPort }}
              protocol: TCP
          env:
            - name: DISPATCHARR_PORT
              value: {{ .Values.dispatcharr.service.targetPort | quote }}
            {{- range $name, $value := .Values.dispatcharr.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- $gpu := default (dict) .Values.gpu }}
            {{- if and $gpu.enabled (eq $gpu.provider "nvidia") }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "video,utility"
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.dispatcharr.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.dispatcharr.startupProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- include "kubarr-common.gpu.resources" (dict "root" . "resources" .Values.dispatcharr.resources) | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/data") | nindent 12 }}
        - name: tuner
          image: "{{ .Values.dispatcharr.tuner.image.repository }}:{{ .Values.dispatcharr.tuner.image.tag }}"
          imagePullPolicy: {{ .Values.dispatcharr.tuner.image.pullPolicy }}
          ports:
            - name: tuner
              containerPort: {{ .Values.dispatcharr.tuner.port }}
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: tuner
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dispatcharr.tuner.resources | nindent 12 }}
          volumeMounts:
            - name: tuner-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tuner-tmp
              mountPath: /tmp
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        - name: tuner-config
          configMap:
            name: {{ include "dispatcharr.fullname" . }}-tuner
        - name: tuner-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "dispatcharr.fullname" .)) | nindent 8 }}
      {{- include "kubarr-common.gluetun.dnsConfig" (dict "root" .) | nindent 6 }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
