apiVersion: v2
name: dispatcharr
description: IPTV stream and EPG manager that serves your provider's channels to Jellyfin as an HDHomeRun tuner
type: application
version: 0.33.0+9
appVersion: "0.33.0"
home: https://github.com/Dispatcharr/Dispatcharr
sources:
  - https://github.com/Dispatcharr/Dispatcharr
maintainers:
  - name: Kubarr Team
# Kubarr annotations - used by the catalog service (services/catalog.rs) for app discovery.
annotations:
  kubarr.io/display-name: "Dispatcharr"
  kubarr.io/icon: "📡"
  kubarr.io/category: "media-server"
  # The UI serves from the root of its host, so it needs its own (sub)domain in
  # Kubarr's Domains settings; Jellyfin reaches it inside the cluster either way.
  kubarr.io/browseable: "true"
  # Kubarr's gateway sends the signed-in username in X-Kubarr-User; enable
  # Settings > Reverse Proxy Auth with that header for single sign-on.
  kubarr.io/user-header: "true"
dependencies:
  - name: kubarr-common
    version: 0.8.4
    repository: file://../../system/kubarr-common
