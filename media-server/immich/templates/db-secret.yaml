{{- if and .Values.database.bundled.enabled (not .Values.database.existingSecret) -}}
{{- $name := include "immich.dbSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name $name -}}
{{- if and .Release.IsUpgrade (not $existing) -}}
{{- fail (printf "Generated database Secret %s is missing on upgrade; restore it from backup before continuing" $name) -}}
{{- end -}}
{{- $claim := default (printf "data-%s-postgres-0" (include "immich.fullname" .)) .Values.database.bundled.persistence.existingClaim -}}
{{- $oldClaim := lookup "v1" "PersistentVolumeClaim" .Values.namespace.name $claim -}}
{{- if and (not $existing) $oldClaim (or (ne $oldClaim.status.phase "Pending") $oldClaim.spec.volumeName) -}}
{{- fail (printf "Database claim %s already exists but generated Secret %s is missing; restore matching credentials or set database.existingSecret" $claim $name) -}}
{{- end -}}
{{- if and $existing (not (index $existing.data .Values.database.passwordKey)) -}}
{{- fail (printf "Generated database Secret %s is missing the configured password key; restore it before continuing" $name) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.database.passwordKey }}: {{ if $existing }}{{ index $existing.data .Values.database.passwordKey | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
