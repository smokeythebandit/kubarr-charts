namespace:
  name: frigate

frigate:
  replicaCount: 1
  image:
    repository: ghcr.io/blakeblackshear/frigate
    tag: "0.18.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8971
    targetPort: 8971
    annotations: {}
  basePath: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  timezone: Etc/UTC
  # Secret keys must be named FRIGATE_*; Frigate substitutes these only in
  # supported configuration fields. Never put camera/MQTT credentials in values.
  existingSecret: ""

# Seeded once when /config/config.yml does not exist. Subsequently edit through
# Frigate's UI or on the local config PVC; Helm upgrades never overwrite it.
# For initial custom configuration, set this BEFORE first installation.
config: |
  mqtt:
    enabled: false
  tls:
    enabled: false
  cameras:
    dummy_camera:
      enabled: false
      ffmpeg:
        inputs:
          - path: rtsp://127.0.0.1:554/rtsp
            roles:
              - detect

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      # Recordings and snapshots; Frigate refuses to start without them.
      main: ["/media/frigate"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      # /config is the private claim, /dev/shm and /tmp/cache are the
      # chart's own in-memory volumes for decoded frames and segments.
      main: ["/config", "/dev/shm", "/tmp/cache"]

storage:
  mounts:
    - {name: recordings, source: frigate, target: /media/frigate, mode: read-write}
  config:
    existingClaim: ""
    storageClassName: "" # cluster default must be local/block, never NFS (SQLite WAL)
    size: 10Gi
  media:
    create: true
    existingClaim: media-data
    nfs: {}
  shmSize: 128Mi
  cacheSize: 1Gi # /tmp/cache recording segment staging, ephemeral RAM

# Optional Kubernetes device plugin allocation. Configure ffmpeg.hwaccel_args
# and/or detectors in Frigate config separately for the allocated hardware.
gpu:
  enabled: false
  provider: intel
  resourceName: ""
  runtimeClassName: ""
  supplementalGroups: []

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # Frigate runs as root, which a root-squashed export maps to nobody. NFS
  # keeps supplementary groups, so the media group still reaches the
  # group-writable recordings directory prepare-media-directories creates.
  supplementalGroups: [1000]
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: ""
  annotations: {}
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  ingressFrom: [openresty]
  egressTo: []
  # Explicit private camera and MQTT broker network ranges (CIDRs).
  privateEgressCIDRs: []

vpa:
  enabled: false
  updateMode: Auto
