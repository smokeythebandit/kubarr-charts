# Default values for prowlarr
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: prowlarr

# Prowlarr application configuration
prowlarr:
  replicaCount: 1

  image:
    repository: linuxserver/prowlarr
    pullPolicy: IfNotPresent
    tag: "2.7.0"

  # Service configuration
  service:
    type: ClusterIP
    port: 9696
    targetPort: 9696
    annotations: {}

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Environment variables
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

  # Base path for reverse proxy (e.g., /prowlarr)
  basePath: "/prowlarr"

  # Probes configuration
  livenessProbe:
    enabled: true
    tcpSocket:
      port: 9696
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    tcpSocket:
      port: 9696
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: false  # linuxserver images run as root but switch to PUID/PGID
  allowPrivilegeEscalation: true
  capabilities: {}
  readOnlyRootFilesystem: false

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Service Account
serviceAccount:
  create: true
  name: prowlarr
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Image pull secrets
imagePullSecrets: []

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: []
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/config", "/custom-services.d/setup-flaresolverr", "/kubarr-secrets/prowlarr"]

storage:
  # Prowlarr stores only its own database and indexer definitions; it never
  # touches the media library or a download directory.
  mounts: []
  config:
    migrationConfirmed: false
    create: true
    existingClaim: ""
    size: 5Gi
    storageClassName: "" # empty: cluster default StorageClass (not managed NFS)
  media:
    existingClaim: media-data

# Prowlarr link. Kubarr sets secretName to a Secret (key: api-key) holding the
# API key it also gives Sonarr, Radarr and Lidarr; init-config writes it into
# config.xml so those apps can register here and receive the indexers. Empty
# keeps the key Prowlarr generates for itself.
prowlarrIntegration:
  secretName: ""

# FlareSolverr solves Cloudflare challenges for protected indexers. While it
# answers at this URL, setup-flaresolverr keeps an indexer proxy tagged
# "flaresolverr" in Prowlarr, and removes it once FlareSolverr is gone; tag an
# indexer to route it through. Empty disables this.
flaresolverr:
  url: "http://flaresolverr.flaresolverr.svc.cluster.local:8191"

# VPN Configuration
# When enabled, a Gluetun sidecar container is added to route all traffic through VPN
vpn:
  enabled: false
  # Name of the Kubernetes secret containing VPN credentials
  # Created by Kubarr when you configure VPN in Settings > Networking
  secretName: ""
  # Gluetun container image
  image:
    repository: qmcgaw/gluetun
    tag: "v3.41.3"
    pullPolicy: IfNotPresent
  # Resource limits for Gluetun container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Kill switch - block all traffic if VPN disconnects
  killSwitch: true
  # Subnets to allow even when VPN is active (for cluster internal communication)
  firewallOutboundSubnets: ""
  # Port forwarding via NAT-PMP (supported by ProtonVPN, PIA, AirVPN)
  portForwarding:
    enabled: false
    upCommand: ""
  # Server picker: chooses the fastest VPN server before gluetun starts and
  # re-evaluates it while the pod runs. Reads fall back to these defaults.
  picker:
    enabled: true
    shortlist: 5
    sample: 40
    initBudget: 60s
    testSeconds: 8
    testEndpoints:
      - https://proof.ovh.net/files/100Mb.dat
      - http://speedtest.tele2.net/100MB.zip
    interval: 15m
    degradeThreshold: 0.4
    degradeChecks: 3
    cooldown: 6h
    switchWhileRunning: true
    image:
      repository: ghcr.io/smokeythebandit/kubarr-vpn-picker
      tag: main
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Network policy configuration
networkPolicy:
  enabled: true
  # Permit only this release's exporter pod to call the app API in this namespace
  allowExporterIngress: true
  # Namespaces allowed to send traffic to this app
  ingressFrom:
    - openresty  # Kubarr gateway proxy
    - victoriametrics  # metrics scraping
    - radarr  # movie manager searches through the indexer manager
    - sonarr  # series manager searches through the indexer manager
    - lidarr  # music manager searches through the indexer manager
  # Namespaces this app can send traffic to. The shared policy already permits
  # egress to the public internet, which is what indexer queries need.
  egressTo:
    - radarr  # applications Prowlarr pushes its indexers to
    - sonarr
    - lidarr
    - flaresolverr  # Cloudflare challenge solver (service port 8191)

# Metrics exporter (exportarr) - auto-scraped by VictoriaMetrics
# Note: the API key is read from the config.xml Prowlarr generates
exporter:
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    tag: "v2.3.0"
    pullPolicy: IfNotPresent
  # 9707 is Sonarr's and 9708 is Radarr's; keep one port per exporter
  port: 9710
  # API key from Prowlarr (Settings > General > API Key)
  # Can be set via secret or directly
  apiKey: ""
  # Or reference an existing secret
  apiKeySecret:
    name: ""
    key: "api-key"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
