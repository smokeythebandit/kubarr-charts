apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowlarr.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.prowlarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prowlarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        kubarr.io/prowlarr-link: {{ (default dict .Values.prowlarrIntegration).secretName | quote }}
        {{- if include "prowlarr.flaresolverrUrl" . }}
        checksum/setup: {{ include (print $.Template.BasePath "/setup-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "prowlarr.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "prowlarr.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "kubarr-common.storage.prepareMounts" (dict "root" . "uid" .Values.prowlarr.env.PUID "gid" .Values.prowlarr.env.PGID) | nindent 8 }}
        - name: init-config
          image: busybox:1.38.0
          securityContext:
            runAsUser: {{ .Values.prowlarr.env.PUID | int }}
            runAsGroup: {{ .Values.prowlarr.env.PGID | int }}
            runAsNonRoot: {{ ne (int .Values.prowlarr.env.PUID) 0 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              mkdir -p /config
              CONFIG_FILE="/config/config.xml"
              if [ ! -f "$CONFIG_FILE" ]; then
                # Create initial config
                cat > "$CONFIG_FILE" << 'EOF'
              <Config>
                <UrlBase>{{ .Values.prowlarr.basePath }}</UrlBase>
                <BindAddress>*</BindAddress>
                <Port>9696</Port>
                <EnableSsl>False</EnableSsl>
                <AuthenticationMethod>External</AuthenticationMethod>
                <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>
              </Config>
              EOF
              else
                # Update existing config to disable authentication
                echo "Updating authentication settings in existing config..."
                # Update AuthenticationMethod to External
                if grep -q "<AuthenticationMethod>" "$CONFIG_FILE"; then
                  sed -i 's|<AuthenticationMethod>[^<]*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <AuthenticationMethod>External</AuthenticationMethod>\n</Config>|' "$CONFIG_FILE"
                fi
                # Update AuthenticationRequired
                if grep -q "<AuthenticationRequired>" "$CONFIG_FILE"; then
                  sed -i 's|<AuthenticationRequired>[^<]*</AuthenticationRequired>|<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>\n</Config>|' "$CONFIG_FILE"
                fi
                {{- if .Values.prowlarr.basePath }}
                # Ensure UrlBase is set
                if grep -q "<UrlBase>" "$CONFIG_FILE"; then
                  sed -i 's|<UrlBase>[^<]*</UrlBase>|<UrlBase>{{ .Values.prowlarr.basePath }}</UrlBase>|g' "$CONFIG_FILE"
                else
                  sed -i 's|</Config>|  <UrlBase>{{ .Values.prowlarr.basePath }}</UrlBase>\n</Config>|' "$CONFIG_FILE"
                fi
                {{- end }}
              fi
              {{- if (default dict .Values.prowlarrIntegration).secretName }}
              # Kubarr's key, shared with the managers that register here, so
              # they can reach Prowlarr's API before it ever generated a key.
              KEY=$(tr -d '[:space:]' < /kubarr-secrets/prowlarr/api-key)
              if grep -q "<ApiKey>" "$CONFIG_FILE"; then
                sed -i "s|<ApiKey>[^<]*</ApiKey>|<ApiKey>$KEY</ApiKey>|" "$CONFIG_FILE"
              else
                sed -i "s|</Config>|  <ApiKey>$KEY</ApiKey>\n</Config>|" "$CONFIG_FILE"
              fi
              {{- end }}
              echo "Config file contents:"
              sed 's|<ApiKey>[^<]*</ApiKey>|<ApiKey>(hidden)</ApiKey>|' "$CONFIG_FILE"
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config") | nindent 12 }}
            {{- if (default dict .Values.prowlarrIntegration).secretName }}
            - name: prowlarr-api-key
              mountPath: /kubarr-secrets/prowlarr
              readOnly: true
            {{- end }}
        {{- include "kubarr-common.gluetun.initContainer" (dict "root" .) | nindent 8 }}
      containers:
        {{- include "kubarr-common.gluetun.container" (dict "root" . "appPort" .Values.prowlarr.service.targetPort "inputPorts" (ternary (toString .Values.exporter.port) "" .Values.exporter.enabled)) | nindent 8 }}
        - name: prowlarr
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.prowlarr.image.repository }}:{{ .Values.prowlarr.image.tag }}"
          imagePullPolicy: {{ .Values.prowlarr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.prowlarr.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "prowlarr.fullname" . }}-config
          {{- if .Values.prowlarr.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.prowlarr.livenessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.prowlarr.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.prowlarr.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.prowlarr.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.prowlarr.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.prowlarr.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.prowlarr.readinessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.prowlarr.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.prowlarr.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.prowlarr.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.prowlarr.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.prowlarr.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.appMounts" (dict "root" . "reservedPaths" (dig "storage" "reserved" "main" (list) (default dict .Values.kubarr))) | nindent 12 }}
            {{- if include "prowlarr.flaresolverrUrl" . }}
            - name: setup-scripts
              mountPath: /custom-services.d/setup-flaresolverr
              subPath: setup-flaresolverr.sh
            {{- end }}
      volumes:
        {{- include "kubarr-common.gluetun.volumes" (dict "root" .) | nindent 8 }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "prowlarr.fullname" .)) | nindent 8 }}
        {{- if include "prowlarr.flaresolverrUrl" . }}
        - name: setup-scripts
          configMap:
            name: {{ include "prowlarr.fullname" . }}-setup
            defaultMode: 0755
        {{- end }}
        {{- if (default dict .Values.prowlarrIntegration).secretName }}
        - name: prowlarr-api-key
          secret:
            secretName: {{ (default dict .Values.prowlarrIntegration).secretName }}
            items:
              - key: api-key
                path: api-key
        {{- end }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
