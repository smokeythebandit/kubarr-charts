apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jackett.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jackett.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jackett.replicaCount }}
  selector:
    matchLabels:
      {{- include "jackett.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jackett.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jackett.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.jackett.basePath }}
      initContainers:
        - name: init-config
          image: busybox:1.38.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              mkdir -p /config/Jackett
              if [ ! -f /config/Jackett/ServerConfig.json ]; then
                cat > /config/Jackett/ServerConfig.json << 'EOF'
              {"BasePathOverride":"{{ .Values.jackett.basePath }}","UpdateDisabled":true,"APIKey":"{{ .Values.jackett.apiKey }}"}
              EOF
              {{- if .Values.jackett.apiKey }}
              else
                # Keep the API key pinned so indexer sync in media managers stays valid
                sed -i 's/"APIKey": *"[^"]*"/"APIKey":"{{ .Values.jackett.apiKey }}"/' /config/Jackett/ServerConfig.json
              fi
              {{- else }}
              fi
              {{- end }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" . "mountPath" "/config") | nindent 12 }}
      {{- end }}
      containers:
        {{- if .Values.vpn.enabled }}
        # Gluetun VPN sidecar - routes all pod traffic through VPN
        - name: gluetun
          image: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag }}"
          imagePullPolicy: {{ .Values.vpn.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          envFrom:
            - secretRef:
                name: {{ .Values.vpn.secretName }}
          env:
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "{{ .Values.vpn.firewallOutboundSubnets }}"
            {{- if .Values.vpn.killSwitch }}
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "{{ .Values.jackett.service.targetPort }},9999,8001"
            {{- else }}
            - name: FIREWALL
              value: "off"
            {{- end }}
            - name: HEALTH_SERVER_ADDRESS
              value: ":9999"
            # Move control server off port 8000 to avoid conflict with exporter
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8001"
            {{- if .Values.vpn.portForwarding.enabled }}
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "on"
            {{- if .Values.vpn.portForwarding.upCommand }}
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: {{ .Values.vpn.portForwarding.upCommand | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: gluetun-http
              containerPort: 8888
              protocol: TCP
            - name: gluetun-ctrl
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.vpn.resources | nindent 12 }}
        {{- end }}
        - name: jackett
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.jackett.image.repository }}:{{ .Values.jackett.image.tag }}"
          imagePullPolicy: {{ .Values.jackett.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jackett.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "jackett.fullname" . }}-config
          {{- if .Values.jackett.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.jackett.livenessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.jackett.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jackett.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jackett.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jackett.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.jackett.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.jackett.readinessProbe.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.jackett.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jackett.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jackett.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jackett.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.jackett.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
      volumes:
        {{- if .Values.vpn.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "jackett.fullname" .)) | nindent 8 }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}
