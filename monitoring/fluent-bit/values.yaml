namespace:
  create: true
  name: fluent-bit

fluentbit:
  image:
    repository: fluent/fluent-bit
    tag: "5.1.1"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # VictoriaLogs push endpoint (Loki-compatible API)
  logsUrl: "http://victorialogs.victorialogs.svc.cluster.local:9428"

  # Container log paths on host
  podLogPath: /var/log/pods

  # Namespaces to collect logs from (comma-separated list for Lua matching)
  allowedNamespaces:
    - sonarr
    - radarr
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - jellyfin
    - jellyseerr
    - jackett
    - sabnzbd
    - kubarr-backend
    - victoriametrics
    - victorialogs
    - fluent-bit
    - grafana

rbac:
  create: true

serviceAccount:
  create: true
  name: fluent-bit

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

podAnnotations: {}

# The tail positions database must remain node-local. SQLite on shared NFS can
# block startup, and a DaemonSet must not share one positions database across nodes.
# DirectoryOrCreate makes this root-owned with mode 0755; Fluent Bit already runs
# as UID/GID 0 and writes only beneath this dedicated path.
bufferStorage:
  hostPath: /var/lib/fluent-bit
  mountPath: /buffers

# Gate liveness until Fluent Bit has initialized its inputs, filters, and HTTP server.
startupProbe:
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

# Network policy configuration
networkPolicy:
  enabled: true
  # Fluent Bit needs to send logs to VictoriaLogs
  egressTo:
    - victorialogs
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  targetKind: DaemonSet
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
