{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubarr-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubarr-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the collector scrapes this exporter; nothing else has a reason to.
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.kubeStateMetrics.service.targetPort }}
    {{- end }}
  egress:
    # DNS, to resolve the API server's service name.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Kubernetes API, which is the only thing this pod talks to. On Cilium
    # these CIDR rules never match the apiserver's host identity; the
    # CiliumNetworkPolicy in apiserver-egress.yaml covers that case.
    {{- range .Values.networkPolicy.apiServerCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
