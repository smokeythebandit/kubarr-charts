namespace:
  create: true
  name: victorialogs

victorialogs:
  replicaCount: 1

  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.52.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9428
    targetPort: 9428

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Data retention period
  retention: "7d"

  # Storage path inside container
  storagePath: /data

  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # NFS-backed storage can take time to initialize before the HTTP server starts.
  startupProbe:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Extra command line arguments
  extraArgs: []

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

storage:
  media:
    existingClaim: media-data
    dataSubPath: system/victorialogs

serviceAccount:
  create: true
  name: victorialogs

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - fluent-bit     # for log ingestion
    - grafana        # for log queries
    - kubarr-backend  # Kubarr backend for log queries
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
