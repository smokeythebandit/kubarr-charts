namespace:
  create: true
  name: victorialogs

victorialogs:
  replicaCount: 1

  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.53.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9428
    targetPort: 9428

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Data retention period
  retention: "7d"

  # Storage path inside container
  storagePath: /data

  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # NFS-backed storage can take time to initialize before the HTTP server starts.
  startupProbe:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Extra command line arguments
  extraArgs: []

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      # Mirrors victorialogs.storagePath, which the template passes to the
      # validator and the server takes as -storageDataPath.
      main: ["/data"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/tmp"]

storage:
  mounts:
    - {name: logs-data, source: system/victorialogs, target: /data, mode: read-write}
  media:
    existingClaim: media-data

serviceAccount:
  create: true
  name: victorialogs

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - fluent-bit     # for log ingestion
    - grafana        # for log queries
    - kubarr-backend  # Kubarr backend for log queries
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
