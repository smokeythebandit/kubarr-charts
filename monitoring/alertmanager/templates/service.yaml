{{- $app := .Values.alertmanager -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubarr-common.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubarr-common.labels" . | nindent 4 }}
  annotations:
    {{- /* kubarr.io/base-path: the Kubarr proxy keeps the full path instead of
           stripping the app prefix. Alertmanager runs with
           --web.route-prefix set to the same value, so its UI assets and its
           v2 API both resolve under it. */}}
    kubarr.io/base-path: {{ $app.basePath | quote }}
    {{- /* VictoriaMetrics discovers this target from these annotations. The
           metrics path moves with the route prefix. */}}
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ $app.service.port | quote }}
    prometheus.io/path: {{ printf "%s/metrics" $app.basePath | quote }}
    {{- with $app.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $app.service.type }}
  ports:
    - port: {{ $app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kubarr-common.selectorLabels" . | nindent 4 }}
