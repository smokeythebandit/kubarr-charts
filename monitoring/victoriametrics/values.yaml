namespace:
  create: false  # kubarr deployment manager creates the namespace
  name: victoriametrics

victoriametrics:
  replicaCount: 1

  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.149.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8428
    targetPort: 8428

  # VictoriaMetrics with minimal caching - trades query speed for low RAM
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi

  retention: "7d"

  scrapeInterval: "60s"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  # NFS-backed storage can take time to initialize before the HTTP server starts.
  startupProbe:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# VictoriaMetrics has better compression, so less storage needed
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

storage:
  media:
    existingClaim: media-data
    dataSubPath: system/victoriametrics

rbac:
  create: true

serviceAccount:
  create: true
  name: victoriametrics

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - grafana  # for queries
    - kubarr-backend  # Kubarr backend for monitoring
  # VictoriaMetrics needs to scrape all app namespaces
  scrapeNamespaces:
    - sonarr
    - radarr
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - jackett
    - jellyfin
    - jellyseerr
    - sabnzbd
    - victorialogs
    - fluent-bit
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
