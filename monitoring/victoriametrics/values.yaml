namespace:
  create: false  # kubarr deployment manager creates the namespace
  name: victoriametrics

victoriametrics:
  replicaCount: 1

  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.154.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8428
    targetPort: 8428

  # VictoriaMetrics with minimal caching - trades query speed for low RAM
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi

  retention: "7d"

  scrapeInterval: "60s"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  # NFS-backed storage can take time to initialize before the HTTP server starts.
  startupProbe:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 90

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# VictoriaMetrics has better compression, so less storage needed
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Storage paths this chart's templates enforce, declared here so there is a
# single source of truth: the templates hand these same lists to
# kubarr-common's storage validator, and the backend's install wizard
# (api/src/services/install_options.rs) reads them out of this file to
# validate and pre-fill the mounts it offers. `main` is the primary workload;
# any other key must match a storage.workloads.<name> key in this file.
kubarr:
  storage:
    # Writable persistent mounts the application cannot start without.
    required:
      main: ["/victoria-metrics-data"]
    # Paths this chart's own templates already occupy, which a user mount
    # must not shadow.
    reserved:
      main: ["/etc/prometheus", "/tmp"]

storage:
  mounts:
    - {name: metrics-data, source: system/victoriametrics, target: /victoria-metrics-data, mode: read-write}
  media:
    existingClaim: media-data

rbac:
  create: true

serviceAccount:
  create: true
  name: victoriametrics

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Network policy configuration
networkPolicy:
  enabled: true
  ingressFrom:
    - grafana  # for queries
    - kubarr-backend  # Kubarr backend for monitoring
    - vmalert  # rule evaluation queries, plus remote write/read of ALERTS state
  # VictoriaMetrics needs to scrape all app namespaces
  scrapeNamespaces:
    # Cilium's agents export Hubble flow metrics, which is where the network
    # page's internet/LAN/cluster split comes from. Without this entry the
    # default-deny egress policy blocks the scrape and the panels are silently
    # empty.
    - kube-system
    # Storage traffic lives only in the kernel's NFS client counters: NFS is
    # mounted by the node, not by the pods, so Cilium never sees a byte of it.
    # node-exporter is where those counters come from.
    - node-exporter
    # Per-class byte counters, read from Cilium's conntrack map.
    - kubarr-flow-exporter
    - sonarr
    - radarr
    - qbittorrent
    - transmission
    - deluge
    - rutorrent
    - jackett
    - jellyfin
    - jellyseerr
    - sabnzbd
    - victorialogs
    - fluent-bit
    # Workload-level metrics: pod restarts, deployment availability, PVC phase.
    # Without this the alert rules that read kube_* evaluate against nothing.
    - kube-state-metrics
    - vmalert
    - alertmanager
    - prowlarr
    - lidarr
    - navidrome
# Vertical Pod Autoscaler. Requires the VPA operator/CRD in the cluster.
vpa:
  enabled: false
  updateMode: Auto
  containerName: "*"
  controlledResources:
    - cpu
    - memory
  minAllowed: {}
  maxAllowed: {}
