apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "victoriametrics.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
data:
  # VictoriaMetrics uses standard Prometheus scrape config format
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.victoriametrics.scrapeInterval }}

    scrape_configs:
      # VictoriaMetrics self-monitoring
      - job_name: 'victoriametrics'
        static_configs:
          - targets: ['localhost:{{ .Values.victoriametrics.service.targetPort }}']

      # Kubernetes pods with prometheus.io annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # These chart exporters annotate both their pods and their services.
          # Their paired annotated services own the scrapes; leave other pods alone.
          # Relabeling cannot look up a pod's services, so scope this to the
          # known exporter labels and namespaces (not all *-exporter pods).
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: drop
            regex: radarr;radarr-exporter|sonarr;sonarr-exporter
          # Use custom path if specified
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Use custom port if specified
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          # Add pod label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Add app label from pod labels
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app

      # Kubernetes services with prometheus.io annotations
      # This auto-discovers all exporters when apps are installed
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # Service discovery creates one target per service port. Select the
          # annotated port BEFORE rewriting addresses, or multi-port services
          # (e.g. kube-dns: DNS + metrics) collapse into duplicate targets.
          # Require an exposed Service port annotation; a missing or mismatched
          # port is skipped rather than scraping every port at the same address.
          # VM's keep_if_equal compares label values without regex backrefs.
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            action: keep
            regex: '[0-9]+'
          - source_labels: [__meta_kubernetes_service_port_number, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: keep_if_equal
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # __address__ already contains the selected service port.
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          # Add app label from service name (e.g., qbittorrent-exporter -> qbittorrent)
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            regex: (.+)-exporter
            replacement: $1
            target_label: app

      # Kubelet metrics - disabled, we only need cAdvisor container metrics
      # - job_name: 'kubelet'

      # cAdvisor metrics for container resource usage
      # Filtered to only keep container_* metrics (CPU, memory, network, filesystem)
      - job_name: 'cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        # Only keep metrics we actually use (container_* for per-container metrics,
        # machine_* for node totals, container_last_seen for pod/container counts)
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '(container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes|last_seen)|machine_(cpu_cores|memory_bytes))'
            action: keep

      # Kubernetes API server - disabled, not needed for app monitoring
      # - job_name: 'kubernetes-apiservers'
